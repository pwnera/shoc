[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shoc"
version = "0.1.0"
description = "shoc (Security Headless Operation Center): headless, AI-first, 24/7 agentic SOC"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "shoc maintainers" }]
keywords = ["security", "soc", "ocsf", "detection", "mcp", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]

# Core dependency budget: 8 slots (starlette + uvicorn share the "web" slot).
# sqlglot | psycopg | httpx | web | pyyaml | cryptography | pyjwt | mcp
dependencies = [
  "sqlglot>=25,<28",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.27,<1",
  "starlette>=0.37,<1",
  "uvicorn>=0.30,<1",
  "pyyaml>=6,<7",
  "cryptography>=43,<47",
  "pyjwt>=2.9,<3",
  "mcp>=1.10,<2",
]

[project.optional-dependencies]
databricks = ["databricks-sql-connector>=3,<5"]
snowflake = ["snowflake-connector-python>=3,<4"]
# Reading a PDF advisory with intel.digest (DET-7, RFC 0004). An extra rather
# than a core dependency: the core budget is for security machinery, not for
# parsing a file format most reports are not published in.
pdf = ["pypdf>=5,<7"]
# The documentation site (zensical.toml, D68). Pinned: Zensical is still 0.0.x.
docs = ["zensical==0.0.66"]
dev = ["pytest>=8,<9", "ruff>=0.6", "pyright>=1.1.380"]

[project.scripts]
shoc = "shoc.cli:main"

[project.urls]
Homepage = "https://github.com/pwnera/shoc"
Documentation = "https://github.com/pwnera/shoc/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["shoc"]

[tool.hatch.build.targets.wheel.force-include]
"content" = "shoc/_content"
# The attack scenarios, so `shoc replay --scenario` works in the container
# the quick start tells people to run. 80 KB of JSON.
"evals/scenarios" = "shoc/_scenarios"
# Each shipped rule's fixtures, so the Detection Engineer's gate can check that
# a narrowing still fires on what the rule was written to catch (D77).
"tests/fixtures/rules" = "shoc/_rule_fixtures"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
# The code in docs/ and rfcs/ is written as compact sketches, not as modules.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.ruff.lint.flake8-bugbear]
# shoc.jsonschema.field is a thin wrapper around dataclasses.field.
extend-immutable-calls = ["shoc.jsonschema.field", "dataclasses.field"]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
include = ["shoc", "tests"]
reportMissingImports = "warning"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
markers = ["postgres: needs a live Postgres (SHOC_DSN)"]
