id: gcp_service_account_key_new_address
title: A service account key, or the default compute account, is used from an address it never used
hypothesis: >
  A key file that leaked from a repository, a laptop or a CI log is used from
  the attacker's address. A key that runs in one place calls from a handful of
  addresses, so a new one is either a new deployment or somebody else holding it.
  The default compute account's token, which any process on a VM can ask the
  metadata server for, carries no key name. Taken off the VM, it is used from
  outside Google, and a VM's own calls never come from there.
attack: [T1078.004, T1552.001, T1552.005]
logsource:
  product: gcp
  service: audit
window: 1d
cadence_days: 1
detection:
  selection_key:
    actor.session.uid|exists: true
  selection_default_compute:
    actor.user.name|endswith: -compute@developer.gserviceaccount.com
  # What the audit log records instead of an address for calls from inside Google.
  filter_internal:
    src_endpoint.ip: [private, gce-internal-ip]
  condition: (selection_key or selection_default_compute) and not filter_internal
baseline:
  first_seen: [actor.user.name, src_endpoint.ip]
  lookback: 30d
pivot: [actor.session.uid, actor.user.name, src_endpoint.ip, http_request.user_agent]
triage: >
  Does the address belong to the company's cloud, office or CI? Keys used from
  GitHub-hosted runners change address every run, and the user agent says so; a
  key or the default compute account used from a residential or VPS address
  with gcloud or a script is the one to escalate.
follow_up:
  - When was this key created, and by whom? For the default compute account, which VMs run as it?
  - What did the account do from the new address, reads only or changes too?
sensitive: true
sources:
  - name: Datadog Security Labs
    title: Exploring Google Cloud Default Service Accounts
    url: https://securitylabs.datadoghq.com/articles/google-cloud-default-service-accounts/
    relation: inspired
  - name: Stratus Red Team
    title: Steal and Use the GCE Default Service Account Token from Outside Google Cloud
    url: https://github.com/DataDog/stratus-red-team/blob/main/docs/attack-techniques/GCP/gcp.initial-access.use-compute-sa-outside-gcp.md
    license: Apache-2.0
    relation: adapted
