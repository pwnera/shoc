id: aws_compute_new_region
title: An identity launches, sizes or lists compute in a region it never used
hypothesis: >
  Miners sweep every region for instances and vCPU quota, then launch where
  nobody looks. One identity touching compute in a region new to it is that
  sweep, one tuple per region. It sees only the regions the CloudTrail source
  reads.
attack: [T1496.001, T1535, T1580]
logsource:
  product: aws
  service: cloudtrail
window: 1d
cadence_days: 1
detection:
  selection:
    api.operation: [RunInstances, RequestSpotInstances, CreateFleet, RequestSpotFleet, GetServiceQuota, RequestServiceQuotaIncrease, DescribeInstances]
  filter_aws:
    actor.invoked_by|exists: true
  condition: selection and not filter_aws
baseline:
  first_seen: [actor.user.name, cloud.region]
  lookback: 30d
pivot: [actor.user.name, cloud.region, api.operation, src_endpoint.ip]
triage: >
  Does the company run anything in this region? Ten new regions for one
  identity in one day is a sweep, whatever the identity normally does.
sources:
  - name: Elastic hunting
    title: High Frequency of EC2 Multi-Region `DescribeInstances` API Calls
    url: https://github.com/elastic/detection-rules/blob/main/hunting/aws/queries/ec2_discovery_multi_region_describe_instance_calls.toml
    license: Elastic-2.0
    relation: inspired
  - name: Elastic hunting
    title: High Frequency of Service Quotas Multi-Region `GetServiceQuota` API Calls
    url: https://github.com/elastic/detection-rules/blob/main/hunting/aws/queries/servicequotas_discovery_multi_region_get_service_quota_calls.toml
    license: Elastic-2.0
    relation: inspired
  - name: Elastic
    title: AWS Service Quotas Multi-Region GetServiceQuota Requests
    url: https://www.elastic.co/docs/reference/security/prebuilt-rules/rules/integrations/aws/discovery_servicequotas_multi_region_service_quota_requests
    license: Elastic-2.0
    relation: inspired
