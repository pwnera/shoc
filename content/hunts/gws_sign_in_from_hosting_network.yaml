id: gws_sign_in_from_hosting_network
title: A person signs in to Google from a hosting provider's network for the first time
hypothesis: >
  People sign in from homes, offices and phone networks. Adversary-in-the-middle
  relays, token replays and password sprayers run on rented servers at
  DigitalOcean, Linode, Vultr, Hetzner, OVH, Contabo, Scaleway, M247, Leaseweb,
  Hostinger, Datacamp, ColoCrossing and QuadraNet. A person's first successful
  Google sign-in from one of those networks is usually not the person.
attack: [T1078.004]
logsource:
  product: google
  service: reports
window: 1d
cadence_days: 1
detection:
  selection:
    api.service.name: login
    api.operation: login_success
    # The same list as entra_ and okta_sign_in_from_hosting_network: change all three.
    src_endpoint.asn: ["14061", "63949", "20473", "24940", "16276", "51167", "12876", "9009", "60781",
                       "47583", "212238", "36352", "8100"]
  condition: selection
baseline:
  first_seen: [actor.user.name, src_endpoint.asn]
  lookback: 30d
pivot: [actor.user.name, src_endpoint.asn, src_endpoint.ip, src_endpoint.location.country]
triage: >
  Does this person run a VPN or a cloud desktop on that provider? A known VPN
  explains it; a sign-in from a server while the person also signs in from
  home does not.
follow_up:
  - Did the same address sign in as other people, or fail first?
  - Did the account change two-step settings, forwarding or app grants afterwards?
sources:
  - name: Elastic hunting
    title: Azure Entra Authentication Attempts from Abused Hosting Service Providers
    url: https://github.com/elastic/detection-rules/blob/main/hunting/azure/queries/entra_authentication_attempts_from_abused_hosting_service_providers.toml
    license: Elastic-2.0
    relation: inspired
