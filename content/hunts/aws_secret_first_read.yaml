id: aws_secret_first_read
title: An identity reads a secret it has never read
hypothesis: >
  Workloads read the same secrets every day. A principal reading a secret it
  has not read in 30 days is either a new deploy or someone collecting.
attack: [T1555.006]
logsource:
  product: aws
  service: cloudtrail
window: 1d
cadence_days: 1
sensitive: true
detection:
  selection:
    api.operation: GetSecretValue
    status: Success
  filter_aws:
    actor.invoked_by|exists: true
  condition: selection and not filter_aws
baseline:
  first_seen: [actor.user.name, raw.requestParameters.secretId]
  lookback: 30d
pivot: [actor.user.name, raw.requestParameters.secretId, src_endpoint.ip]
triage: >
  Was there a deploy that gave this service a new secret? A human or CI
  identity reading production database credentials it never needed is not one.
sources:
  - name: Elastic
    title: First Time Seen AWS Secret Value Accessed in Secrets Manager
    url: https://www.elastic.co/docs/reference/security/prebuilt-rules/rules/integrations/aws/credential_access_new_terms_secretsmanager_getsecretvalue
    license: Elastic-2.0
    relation: inspired
