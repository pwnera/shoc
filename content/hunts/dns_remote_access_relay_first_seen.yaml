id: dns_remote_access_relay_first_seen
title: A remote-access vendor or ScreenConnect instance is looked up for the first time
hypothesis: >
  A remote-access session reaches its vendor's servers by name, and a
  ScreenConnect instance has a relay name of its own. A vendor, or a
  ScreenConnect instance, this company never looked up before is a tool that
  is not the company's. AnyDesk and TeamViewer hand each session a relay from
  a large, changing set, so their relays are left out and the vendor's fixed
  names stand for it. Windows' own Quick Assist counts too, since callers
  posing as IT support start there before they install anything. Gateway also
  sees it from Macs and unmanaged laptops.
attack: [T1219]
sources:
  - name: Sigma
    title: "DNS Query To Remote Access Software Domain From Non-Browser App"
    url: https://github.com/SigmaHQ/sigma/blob/master/rules/windows/dns_query/dns_query_win_remote_access_software_domains_non_browsers.yml
    author: "frack113, Connor Martin"
    license: DRL-1.1
    relation: adapted
  - name: Elastic
    title: "Newly Observed ScreenConnect Host Server"
    url: https://github.com/elastic/detection-rules/blob/main/rules/windows/command_and_control_newly_observed_screenconnect_host_server.toml
    license: Elastic-2.0
    relation: inspired
  - name: Elastic
    title: "First Time Seen DNS Query to RMM Domain"
    url: https://github.com/elastic/detection-rules/blob/main/rules/windows/command_and_control_dns_rmm_domains_non_browser.toml
    license: Elastic-2.0
    relation: inspired
  - name: Microsoft
    title: "Threat actors misusing Quick Assist in social engineering attacks leading to ransomware"
    url: https://www.microsoft.com/en-us/security/blog/2024/05/15/threat-actors-misusing-quick-assist-in-social-engineering-attacks-leading-to-ransomware/
    author: "Microsoft Threat Intelligence"
    relation: inspired
logsource:
  product: dns
window: 1d
cadence_days: 1
detection:
  # A name under the vendor's domain, with the dot, or the domain itself:
  # `anydesk.com` as a bare suffix also matched notanydesk.com.
  sel_vendor:
    query.hostname|endswith: [.screenconnect.com, .anydesk.com, .teamviewer.com, .rustdesk.com,
                              .atera.com, .splashtop.com, .getscreen.me, .logmein.com,
                              .logmeininc.com, .gotoassist.com, .remoteutilities.com,
                              .netsupportsoftware.com, .dwservice.net, .tmate.io, .zohoassist.com,
                              .beyondtrustcloud.com, .parsec.app, .helpwire.app, .ammyy.com,
                              .kaseya.net, .swi-rc.com, .swi-tc.com, .remotepc.com, .bomgar.com,
                              .remoteassistance.support.services.microsoft.com]
  sel_name:
    query.hostname: [screenconnect.com, anydesk.com, teamviewer.com, rustdesk.com, atera.com,
                     splashtop.com, getscreen.me, logmein.com, logmeininc.com, gotoassist.com,
                     remoteutilities.com, netsupportsoftware.com, dwservice.net, tmate.io,
                     zohoassist.com, beyondtrustcloud.com, parsec.app, helpwire.app, ammyy.com,
                     kaseya.net, swi-rc.com, swi-tc.com, remotepc.com, bomgar.com,
                     remoteassistance.support.services.microsoft.com,
                     remotedesktop-pa.googleapis.com]
  # Rotating relays: AnyDesk's relay-<id>.net.anydesk.com and TeamViewer's
  # numbered router hosts are new most days for a company that uses either.
  # boot.net.anydesk.com and TeamViewer's master hosts, a small set a new
  # install looks up, stay, so the vendor itself still shows.
  relay_anydesk:
    query.hostname|endswith: .net.anydesk.com
  boot_anydesk:
    query.hostname: boot.net.anydesk.com
  relay_teamviewer_host:
    query.hostname|startswith: router
  relay_teamviewer:
    query.hostname|endswith: .teamviewer.com
  condition: (sel_vendor or sel_name) and not (relay_anydesk and not boot_anydesk)
    and not (relay_teamviewer_host and relay_teamviewer)
baseline:
  first_seen: [query.hostname]
  lookback: 30d
pivot: [query.hostname, device.hostname, device.uid, actor.user.name, process.name]
triage: >
  Does the company use this vendor, and is this its own instance? A relay
  looked up by one laptop, right after a call from "IT support", is the case
  to escalate.
follow_up:
  - Which process asked for the name, and when was it installed?
  - Did the person get a call or a message from someone claiming to be IT?
sensitive: true
