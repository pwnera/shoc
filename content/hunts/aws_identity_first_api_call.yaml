id: aws_identity_first_api_call
title: An identity calls a sensitive API it has never called before
hypothesis: >
  An attacker using stolen credentials performs actions the legitimate owner of
  those credentials has never performed. The first call of a sensitive API by a
  given identity is therefore worth a look, even when every call succeeds and
  no rule fires.
attack: [T1078.004, T1580]
logsource:
  product: aws
  service: cloudtrail
window: 1d
cadence_days: 1
detection:
  selection:
    api.operation|in:
      - ListBuckets
      - GetSecretValue
      - BatchGetSecretValue
      - ListUsers
      - ListRoles
      - DescribeInstances
      - ListAccessKeys
      - GetAccountAuthorizationDetails
      - GetCredentialReport
      - ListAccounts
      - DescribeOrganization
      - AssumeRoot
      - AddUserToGroup
      - GetPasswordData
      - DescribeInstanceAttribute
      - CreateKeyPair
      - ImportKeyPair
      - SendSSHPublicKey
      - SendCommand
      - StartSession
      - CreateDocument
      - CreateStack
      - ExportTableToPointInTime
      - Subscribe
      - CreateTopic
      - GetFederationToken
    status: Success
  condition: selection
baseline:
  first_seen: [actor.user.name, api.operation]
  lookback: 30d
pivot: [actor.user.name, src_endpoint.ip, cloud.account.uid]
triage: >
  Is there a change (a new job, a new tool, a new deploy, somebody's first week)
  that explains this identity doing this for the first time today? If the
  identity is a service account, "it decided to look around" is not an
  explanation.
references:
  - https://attack.mitre.org/techniques/T1078/004/
