id: entra_legacy_auth_first_use
title: A user signs in with a legacy mail protocol for the first time
hypothesis: >
  IMAP, POP, SMTP AUTH, ActiveSync and the other basic-auth protocols cannot do
  MFA, so password sprayers and mail-stealing tools use them. A printer or a
  scanner that sends mail settles into the baseline after its first day; a user
  who never used IMAP and suddenly does is worth a look. The same goes for a
  password-only token request (ROPC), which password sprayers use because it
  takes a password and nothing else, so an account with no MFA enforced lets
  it straight in. It is logged as the desktop client every user already has,
  so the protocol is part of what has to be new.
attack: [T1078.004]
logsource:
  product: entra
  service: sign_ins
window: 1d
cadence_days: 7
detection:
  selection:
    status: Success
    raw.clientAppUsed:
      - IMAP4
      - POP3
      - Authenticated SMTP
      - Exchange ActiveSync
      - Exchange Web Services
      - MAPI Over HTTP
      - Outlook Anywhere (RPC over HTTP)
      - Offline Address Book
      - Autodiscover
      - Other clients
  # A password-only token request, with no second factor.
  selection_ropc:
    status: Success
    raw.authenticationRequirement: singleFactorAuthentication
  ropc:
    - raw.authenticationProtocol: ropc
    - http_request.user_agent|contains: [BAV2ROPC, CBAinPROD, CBAinTAR]
  condition: selection or (selection_ropc and ropc)
baseline:
  first_seen: [actor.user.name, raw.clientAppUsed, raw.authenticationProtocol]
  lookback: 30d
pivot: [actor.user.name, raw.clientAppUsed, raw.authenticationProtocol, src_endpoint.ip,
        src_endpoint.location.country, http_request.user_agent]
triage: >
  Is this a device the company set up, such as a printer, a scanner or an old
  phone mail app, signing in from the office? A legacy sign-in from a hosting
  network or another country is someone else using the password.
follow_up:
  - Does conditional access block legacy authentication, and if so why did this one succeed?
  - Did the same address fail sign-ins for other users?
