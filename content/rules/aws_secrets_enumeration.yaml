id: aws_secrets_enumeration
title: Secrets read in bulk
description: >
  One credential read 20 or more different Secrets Manager secrets or
  decrypted SSM parameters within 15 minutes. Workloads read the same few
  secrets over and over; a collection sweep reads each one once. Plain
  parameter reads, console browsing and reads AWS made on a principal's behalf
  are left out. Reads from CloudShell, where LUCR-3 harvested secrets, still
  count.
status: stable
date: 2026-09-24
modified: 2026-10-03
severity: high
confidence: 0.7
attack: [T1552.001, T1555.006]
logsource:
  product: aws
  service: cloudtrail
detection:
  selection_secrets:
    api.operation: GetSecretValue
  selection_ssm:
    api.operation: [GetParameter, GetParameters]
    raw.requestParameters.withDecryption: true
  filter_console:
    raw.sessionCredentialFromConsole: true
  # CloudShell runs on console credentials too, and scripts run there.
  cloudshell:
    http_request.user_agent|contains: exec-env/CloudShell
  filter_aws:
    actor.invoked_by|exists: true
  success:
    status: Success
  condition: success and (selection_secrets or selection_ssm) and not (filter_console and not cloudshell) and not filter_aws
  timeframe: 15m
  group_by: [actor.session.uid]
  # One request names one secret (secretId) or parameter (name, or names for
  # GetParameters), so distinct requests count distinct secrets read.
  count_distinct: raw.requestParameters
  count: ">= 20"
entity: actor.session.uid
fields: [actor.user.name, api.operation, src_endpoint.ip]
sources:
  - name: Elastic
    title: AWS Secrets Manager Rapid Secrets Retrieval
    url: https://www.elastic.co/docs/reference/security/prebuilt-rules/rules/integrations/aws/credential_access_rapid_secret_retrieval_attempts_from_secretsmanager
    license: Elastic-2.0
    relation: inspired
  - name: Elastic
    title: AWS Systems Manager SecureString Parameter Request with Decryption Flag
    url: https://www.elastic.co/docs/reference/security/prebuilt-rules/rules/integrations/aws/credential_access_retrieve_secure_string_parameters_via_ssm
    license: Elastic-2.0
    relation: inspired
  - name: Elastic hunting
    title: Secrets Manager High Frequency of Programmatic GetSecretValue API Calls
    url: https://github.com/elastic/detection-rules/blob/main/hunting/aws/queries/secretsmanager_high_frequency_get_secret_value.toml
    license: Elastic-2.0
    relation: inspired
  - name: Permiso
    title: "LUCR-3: Scattered Spider Getting SaaS-y in the Cloud"
    url: https://permiso.io/blog/lucr-3-scattered-spider-getting-saas-y-in-the-cloud
    relation: inspired
  - name: AWS
    title: Incident response guide for AWS CloudTrail investigations, part 1
    url: https://aws.amazon.com/blogs/security/incident-response-guide-for-aws-cloudtrail-investigations-part-1/
    relation: inspired
