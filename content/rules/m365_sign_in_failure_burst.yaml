id: m365_sign_in_failure_burst
title: Password spray against Microsoft 365 from one address (Microsoft 365 audit)
description: >
  Ten or more different accounts failed to sign in from one address within
  half an hour, on a wrong password, an unknown or locked account, or a
  disabled user: somebody is trying a few passwords against the whole tenant.
  This copy of the Entra rule reads the unified audit log, for tenants without
  Entra P1. Failures that only ask for MFA, a fresh token or a compliant device
  do not count, and one person retrying their own password is one account.
status: experimental
date: 2026-10-12
severity: medium
confidence: 0.6
attack: [T1110.003, T1110.001]
logsource:
  product: m365
  service: management
detection:
  selection:
    api.operation: UserLoginFailed
    status_code: ["50126", "50053", "50056", "50055", "50034", "50057", "50064", "50144"]
  condition: selection
  timeframe: 30m
  group_by: [src_endpoint.ip]
  count_distinct: actor.user.name
  count: ">= 10"
entity: src_endpoint.ip
fields: [actor.user.name, src_endpoint.ip, status_code, http_request.user_agent]
sources:
  - name: Elastic
    title: Entra ID User Sign-in Brute Force Attempted
    url: https://www.elastic.co/docs/reference/security/prebuilt-rules/rules/integrations/azure/credential_access_entra_id_brute_force_activity
    license: Elastic-2.0
    relation: inspired
  - name: Microsoft
    title: Microsoft Entra authentication and authorization error codes
    url: https://learn.microsoft.com/en-us/entra/identity-platform/reference-error-codes
    relation: inspired
