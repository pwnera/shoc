id: endpoint_lsass_dump_or_credential_tool
title: A command dumped LSASS memory or ran a credential-dumping tool
description: >
  A command wrote LSASS's memory to a file (comsvcs.dll MiniDump through
  rundll32, procdump, createdump, rdrleakdiag), named an LSASS dump file, or ran
  Mimikatz, nanodump, pypykatz or LaZagne. Intruders do this on the first
  machine they reach to collect a domain or local admin password, and LaZagne
  also takes every password saved on it. The EDR usually blocks these; the rule
  is what is left when it runs in detect-only mode or excludes the folder. A
  procdump of any other process is left out.
status: experimental
date: 2026-10-09
severity: high
confidence: 0.85
attack: [T1003.001, T1555]
sources:
