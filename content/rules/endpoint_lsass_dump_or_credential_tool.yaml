logsource:
  product: edr
  service: telemetry
detection:
  selection_process:
    class_uid: 1007
    activity_id: 1
  # MiniDump by name or by ordinal 24, as Medusa's "#+0000^24".
  sel_comsvcs:
    process.cmd_line|contains: comsvcs
  sel_comsvcs_full:
    process.cmd_line|contains: full
  sel_comsvcs_export:
    process.cmd_line|contains: [minidump, '#24', '#+', '#-', '#65560', '24 ']
  sel_dump_flag:
    process.cmd_line|contains: [' -ma ', ' /ma ', ' -mm ', ' /mm ', ' -mp ', ' /mp ', ' -u ', ' --full ']
  sel_lsass:
    process.cmd_line|contains: lsass
  sel_dump_file:
    process.cmd_line|contains: .dmp
  sel_rdrleakdiag:
    process.name: rdrleakdiag.exe
    process.cmd_line|contains: memdmp
  sel_tool:
    process.cmd_line|contains: [lsassdump, lsassdmp, lsass.zip, nanodump, pypykatz, mimikatz, DumpCreds,
                                'sekurlsa::', 'lsadump::', 'privilege::debug', 'kerberos::', 'dpapi::',
                                'vault::', 'token::elevate']
  sel_lazagne:
    - process.name: lazagne.exe
    - process.cmd_line|contains: lazagne
  sel_lazagne_module:
    process.cmd_line|contains: [' all', ' browsers', ' windows', ' memory', ' sysadmin', ' mails', ' wifi']
  condition: selection_process and ((sel_comsvcs and sel_comsvcs_full and sel_comsvcs_export) or (sel_lsass and (sel_dump_flag or sel_dump_file)) or sel_rdrleakdiag or sel_tool or (sel_lazagne and sel_lazagne_module))
  timeframe: 15m
entity: resource.uid
fields: [device.hostname, actor.user.name, process.name, process.cmd_line,
         process.parent_process.name, process.file.path]
