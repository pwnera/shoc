id: okta_password_reset_by_admin
title: Password reset for another user by an administrator
description: >
  An administrator, or Okta support, reset somebody else's password. It is
  ordinary at a help desk and a takeover everywhere else. A self-service reset,
  which Okta logs under its own system account, is left out; a reset by Okta
  support is logged under the same account with the transaction id "unknown"
  and is kept.
status: stable
date: 2026-09-24
modified: 2026-10-03
severity: medium
confidence: 0.5
attack: [T1098]
logsource:
  product: okta
  service: system_log
detection:
  selection:
    api.operation: user.account.reset_password
    resource.uid|exists: true
  self_service:
    resource.uid|fieldref: actor.user.name
  okta_system:
    actor.user.name: system@okta.com
  okta_support:
    raw.transaction.id: unknown
  condition: selection and not self_service and not (okta_system and not okta_support)
  timeframe: 15m
entity: actor.user.name
fields: [actor.user.name, resource.uid, src_endpoint.ip]
sources:
  - name: Okta
    title: Find Password Reset Event Performed by an Admin
    url: https://support.okta.com/help/s/article/how-to-find-password-reset-event-performed-by-an-admin?language=en_US
    relation: inspired
  - name: Okta
    title: Auditing Customer Support Actions in the Okta Tenant Using System Log
    url: https://support.okta.com/help/s/article/Auditing-customer-support-actions-in-your-Okta-tenant-using-System-Log?language=en_US
    relation: inspired
  - name: Okta
    title: Common Okta System Log Queries for Attempted Account Takeover and Administrator Activity
    url: https://support.okta.com/help/s/article/System-Log-queries-for-attempted-account-takeover?language=en_US
    relation: inspired
