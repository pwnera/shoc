logsource:
  product: edr
  service: telemetry
detection:
  selection_process:
    class_uid: 1007
    activity_id: 1
  sel_adfind:
    - process.name: adfind.exe
    - raw.properties.ProcessVersionInfoOriginalFileName: AdFind.exe
  # AdFind's own shortcuts, which survive a rename. 'adinfo' is left out: it is
  # also Centrify's AD status command on Linux and Mac servers.
  sel_adfind_flags:
    process.cmd_line|contains: [trustdmp, dcmodes, '-sc dclist', computers_pwdnotreqd, computer_pwdnotreqd,
                                subnetdmp, gpodmp, admincountdmp, users_noexpire, computers_active,
                                '-sc u:', dompol, ' oudmp', fspdmp, '-subnets -f', exchaddresses, domainncs]
  sel_sharphound:
    - process.name: [SharpHound.exe, BloodHound.exe, SOAPHound.exe]
    - process.cmd_line|contains: [' -CollectionMethod', ' --CollectionMethods', Invoke-BloodHound,
                                  Get-BloodHoundData, ' --Loop --Loopduration ', '.exe -c All -d ']
  sel_adexplorer:
    process.name: [ADExplorer.exe, ADExplorer64.exe, ADExplorer64a.exe, ADExp.exe]
    process.cmd_line|contains: snapshot
  sel_nltest:
    process.name: nltest.exe
    process.cmd_line|contains: [domain_trusts, all_trusts, trusted_domains, 'dclist:']
  condition: selection_process and (sel_adfind or sel_adfind_flags or sel_sharphound or sel_adexplorer or sel_nltest)
  timeframe: 1h
entity: resource.uid
fields: [device.hostname, actor.user.name, process.name, process.cmd_line,
         process.parent_process.name, process.file.path]
