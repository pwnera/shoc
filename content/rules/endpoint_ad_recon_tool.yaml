id: endpoint_ad_recon_tool
title: AdFind, SharpHound, an ADExplorer snapshot or nltest trust discovery ran
description: >
  AdFind ran or one of its dump shortcuts did (also renamed), SharpHound or
  BloodHound collected, ADExplorer took a snapshot, or nltest listed the domain
  trusts or domain controllers. Intruders map the admins, computers, trusts and
  subnets of the Active Directory this way in the first hours after a
  foothold; The DFIR Report and CISA describe it before most ransomware
  deployments. A small company's IT person rarely runs any of them. net group
  "domain admins" /domain is left out because IT runs it; an MSP auditing AD
  with AdFind looks the same.
status: experimental
date: 2026-10-09
severity: high
confidence: 0.65
attack: [T1087.002, T1069.002, T1482, T1018]
