id: entra_device_code_sign_in
title: Sign-in through the device code flow
description: >
  Someone signed in by typing a code on microsoft.com/devicelogin. Device code
  phishing sends that code to the victim, who signs in for the attacker and
  hands over a token without the attacker ever seeing a password or an MFA
  prompt. A company of this size rarely uses the flow on purpose. Storm-2372
  asked for the code with the Microsoft Authentication Broker's client ID, so
  the token could register a device; Windows never joins a device this way.
status: experimental
date: 2026-10-02
modified: 2026-10-03
severity: high
confidence: 0.65
attack: [T1566.002, T1528, T1550.001]
logsource:
  product: entra
  service: sign_ins
detection:
  selection:
    - raw.authenticationProtocol: deviceCode
    - raw.properties.authenticationProtocol: deviceCode
  filter_failed:
    status: Failure
  condition: selection and not filter_failed
  timeframe: 15m
entity: actor.user.name
fields: [actor.user.name, api.operation, src_endpoint.ip, src_endpoint.asn, http_request.user_agent]
sources:
