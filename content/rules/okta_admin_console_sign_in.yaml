    title: Risk scoring
    url: https://help.okta.com/en-us/content/topics/security/security_risk_scoring.htm
    relation: inspired
  - name: Okta
    title: Cross-Tenant Impersonation - Prevention and Detection
    url: https://sec.okta.com/articles/2023/08/cross-tenant-impersonation-prevention-and-detection
    relation: inspired
