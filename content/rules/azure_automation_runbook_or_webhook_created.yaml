id: azure_automation_runbook_or_webhook_created
title: Azure Automation runbook or webhook created or changed
description: >
  A runbook or a webhook was written in an Azure Automation account. A runbook
  runs code as the Automation account's managed identity, on a schedule or
  whenever its webhook URL is called, and the URL needs no sign-in: a way back
  in that outlives every user's password. The tutorial runbooks a new
  Automation account comes with are left out. A team that really uses
  Automation will see its own edits here.
status: experimental
date: 2026-10-09
severity: medium
confidence: 0.45
attack: [T1648]
logsource:
  product: azure
  service: activity
detection:
  selection:
    api.operation: [Microsoft.Automation/automationAccounts/runbooks/write,
                    Microsoft.Automation/automationAccounts/webhooks/write]
  filter_tutorial:
    resource.uid|contains: /runbooks/AzureAutomationTutorial
  filter_failed:
    status: Failure
  condition: selection and not filter_tutorial and not filter_failed
  timeframe: 15m
entity: actor.user.name
fields: [actor.user.name, api.operation, resource.uid, src_endpoint.ip, cloud.account.uid]
sources:
