logsource:
  product: edr
  service: telemetry
detection:
  sel_schtasks:
    class_uid: 1007
    activity_id: 1
    process.name: schtasks.exe
    process.cmd_line|contains: create
  sel_cmd_folder:
    process.cmd_line|contains: ['\AppData\', '\Users\Public\', '\ProgramData\', '\Windows\Temp\', '\Perflogs\',
                                '%AppData%', '%LocalAppData%', '%Temp%', '%Tmp%', '%Public%', '%ProgramData%',
                                '%ALLUSERSPROFILE%']
  # '.js' only before a space or a quote: a bare '.js' is in '.json'.
  sel_cmd_script:
    process.cmd_line|contains: [powershell, pwsh, wscript, cscript, mshta, rundll32, regsvr32, cmd.exe, 'cmd /c',
                                conhost, node.exe, python.exe, pythonw.exe, .ps1, .vbs, .vbe, .jse, '.js ', '.js"',
                                .hta, .bat, .cmd, .wsf]
  # Any program where no installer puts one, such as Lunar Spider's
  # %ALLUSERSPROFILE%\USOShared\lsassa.exe.
  sel_cmd_drop_folder:
    process.cmd_line|contains: ['\Users\Public\', '\Windows\Temp\', '\Perflogs\', '%Public%', '%ALLUSERSPROFILE%',
                                '%ProgramData%']
  sel_task_defender:
    raw.category: AdvancedHunting-DeviceEvents
    api.operation: [ScheduledTaskCreated, ScheduledTaskUpdated]
  # TaskContent is JSON text inside AdditionalFields, so its backslashes can
  # stay doubled after the connector's one decode; these tokens hold either way.
  sel_task_defender_folder:
    raw.properties.AdditionalFields.TaskContent|contains: [AppData, ProgramData, Perflogs, 'Users\Public',
                                                           'Users\\Public', 'Windows\Temp', 'Windows\\Temp',
                                                           '%Public%', '%ALLUSERSPROFILE%']
  sel_task_defender_script:
    raw.properties.AdditionalFields.TaskContent|contains: [powershell, pwsh, wscript, cscript, mshta, rundll32,
                                                           regsvr32, cmd.exe, conhost, node.exe, python.exe,
                                                           pythonw.exe, .ps1, .vbs, .vbe, .jse, .hta, .bat, .wsf]
  sel_task_falcon:
    api.operation: ScheduledTaskRegistered
  sel_task_falcon_folder:
    - raw.TaskExecCommand|contains: ['\AppData\', '\Users\Public\', '\ProgramData\', '\Windows\Temp\', '\Perflogs\',
                                     '%AppData%', '%LocalAppData%', '%Temp%', '%Tmp%', '%Public%', '%ProgramData%',
                                     '%ALLUSERSPROFILE%']
    - raw.TaskExecArguments|contains: ['\AppData\', '\Users\Public\', '\ProgramData\', '\Windows\Temp\',
                                       '\Perflogs\', '%AppData%', '%LocalAppData%', '%Temp%', '%Tmp%', '%Public%',
                                       '%ProgramData%', '%ALLUSERSPROFILE%']
  sel_task_falcon_script:
    - raw.TaskExecCommand|contains: [powershell, pwsh, wscript, cscript, mshta, rundll32, regsvr32, cmd.exe,
                                     conhost, node.exe, python.exe, pythonw.exe, .ps1, .vbs, .vbe, .jse, .hta, .bat,
                                     .cmd, .wsf]
    - raw.TaskExecArguments|contains: [.ps1, .vbs, .vbe, .jse, '.js ', '.js"', .hta, .bat, .cmd, .wsf]
    - raw.TaskExecArguments|endswith: .js
  sel_run_defender:
    raw.category: AdvancedHunting-DeviceRegistryEvents
    api.operation: RegistryValueSet
    raw.properties.RegistryKey|contains: '\CurrentVersion\Run'
  sel_run_defender_folder:
    raw.properties.RegistryValueData|contains: ['\AppData\', '\Users\Public\', '\ProgramData\', '\Windows\Temp\',
                                                '\Perflogs\', '%AppData%', '%LocalAppData%', '%Temp%', '%Tmp%',
                                                '%Public%', '%ProgramData%', '%ALLUSERSPROFILE%']
  sel_run_defender_script:
    raw.properties.RegistryValueData|contains: [powershell, pwsh, wscript, cscript, mshta, rundll32, regsvr32,
                                                cmd.exe, 'cmd /c', conhost, node.exe, python.exe, pythonw.exe,
                                                .ps1, .vbs, .vbe, .jse, '.js ', '.js"', .hta, .bat, .cmd, .wsf]
  sel_run_falcon:
    api.operation: AsepValueUpdate
    raw.RegObjectName|contains: '\CurrentVersion\Run'
  sel_run_falcon_folder:
    raw.RegStringValue|contains: ['\AppData\', '\Users\Public\', '\ProgramData\', '\Windows\Temp\', '\Perflogs\',
                                  '%AppData%', '%LocalAppData%', '%Temp%', '%Tmp%', '%Public%', '%ProgramData%',
                                  '%ALLUSERSPROFILE%']
  sel_run_falcon_script:
    raw.RegStringValue|contains: [powershell, pwsh, wscript, cscript, mshta, rundll32, regsvr32, cmd.exe, 'cmd /c',
                                  conhost, node.exe, python.exe, pythonw.exe, .ps1, .vbs, .vbe, .jse, '.js ', '.js"',
                                  .hta, .bat, .cmd, .wsf]
  # Windows Update and installers clean their Temp folder through RunOnce.
  filter_cleanup:
    - raw.properties.RegistryValueData|contains: [DelNodeRunDLL32, ' /c del ', ' /c rd ', ' /c rmdir ']
    - raw.RegStringValue|contains: [DelNodeRunDLL32, ' /c del ', ' /c rd ', ' /c rmdir ']
  sel_startup_file:
    class_uid: 1001
    activity_id: 1
    file.path|contains: '\Start Menu\Programs\Startup\'
    file.path|endswith: [.vbs, .vbe, .js, .jse, .bat, .cmd, .ps1, .hta, .wsf]
  condition: (sel_schtasks and ((sel_cmd_folder and sel_cmd_script) or sel_cmd_drop_folder)) or (sel_task_defender and sel_task_defender_folder and sel_task_defender_script) or (sel_task_falcon and sel_task_falcon_folder and sel_task_falcon_script) or (((sel_run_defender and sel_run_defender_folder and sel_run_defender_script) or (sel_run_falcon and sel_run_falcon_folder and sel_run_falcon_script)) and not filter_cleanup) or sel_startup_file
  timeframe: 1h
# A registry row's resource is its key and a SentinelOne task row's is the
# task, so the device id comes first.
entity: [device.uid, resource.uid]
fields: [device.hostname, actor.user.name, process.name, process.cmd_line, process.parent_process.name,
         raw.properties.RegistryKey, raw.properties.RegistryValueData, raw.RegObjectName,
         raw.RegStringValue, raw.TaskName, raw.TaskExecCommand, raw.TaskExecArguments, file.path]
