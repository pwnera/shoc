id: endpoint_autostart_runs_script_from_user_folder
title: A scheduled task, Run key or Startup file was set to run a script from a user folder
description: >
  Something set itself to start again with Windows (a scheduled task, a Run or
  RunOnce value, or a script in a Startup folder), and the command is a script
  host such as PowerShell, wscript, mshta, rundll32, cmd, node or python, or a
  script file, in AppData, ProgramData, Public, Temp or PerfLogs. Loaders, fake
  CAPTCHA payloads and the Interlock and Lunar Spider crews survive a reboot
  this way. A program in AppData is left out, because installers autostart
  their own from there (OneDrive, Teams, Zoom, Spotify); a scheduled task that
  runs any program from Public, Windows\Temp or PerfLogs still counts.
  SentinelOne's task rows carry no command, so there only the schtasks command
  is seen.
status: experimental
date: 2026-10-09
severity: medium
confidence: 0.6
attack: [T1053.005, T1547.001, T1059]
