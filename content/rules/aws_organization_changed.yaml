id: aws_organization_changed
title: AWS Organizations membership changed, an account closed, or a service's trusted access removed
description: >
  An account was created, invited, removed, closed, given or stripped of
  delegated administration of an organisation-wide service, or tried to leave
  the organisation, or an AWS service lost its trusted access to the
  organisation. These changes move whole accounts outside the controls you
  think you have. Removing GuardDuty's, Security Hub's or CloudTrail's
  trusted access ends their organisation-wide coverage; an attacker in 2025
  removed it for several services, Systems Manager and IAM Access Analyzer
  among them. A denied attempt to leave counts too: it shows intent.
status: stable
date: 2026-09-24
modified: 2026-10-09
severity: high
confidence: 0.7
attack: [T1666, T1098, T1531]
logsource:
  product: aws
  service: cloudtrail
detection:
  selection_change:
    api.operation: [CreateAccount, InviteAccountToOrganization, RemoveAccountFromOrganization, DeleteOrganization, RegisterDelegatedAdministrator, CloseAccount, DisableAWSServiceAccess, DeregisterDelegatedAdministrator]
    status: Success
  selection_leave:
    api.operation: LeaveOrganization
  condition: selection_change or selection_leave
  timeframe: 15m
entity: actor.user.name
fields: [actor.user.name, api.operation, status, cloud.account.uid, raw.requestParameters.servicePrincipal]
sources:
  - name: Elastic
    title: AWS Attempt to Leave Organization
