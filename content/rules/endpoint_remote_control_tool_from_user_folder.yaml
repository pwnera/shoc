logsource:
  product: edr
  service: telemetry
detection:
  # A row without a path cannot be told from an installed copy.
  selection_process:
    class_uid: 1007
    activity_id: 1
    process.file.path|exists: true
  sel_tool:
    - process.name: [client32.exe, rutserv.exe, rfusclient.exe]
    # meshagent.exe, meshagent64-<company>.exe
    - process.name|startswith: meshagent
    - process.cmd_line|contains: --meshServiceName
    # Renamed copies, Defender only: Falcon and SentinelOne carry no version fields.
    - raw.properties.ProcessVersionInfoOriginalFileName|contains: [client32, meshagent]
    - raw.properties.ProcessVersionInfoProductName|contains: [NetSupport Remote Control, Remote Utilities]
  # contains, not startswith: Falcon writes \Device\HarddiskVolume3\Program Files\...
  filter_installed:
    process.file.path|contains: ['\Program Files\', '\Program Files (x86)\', /usr/local/mesh_services/,
                                 /Applications/]
  condition: selection_process and sel_tool and not filter_installed
  timeframe: 1h
entity: resource.uid
fields: [device.hostname, actor.user.name, process.name, process.cmd_line,
         process.parent_process.name, process.file.path]
