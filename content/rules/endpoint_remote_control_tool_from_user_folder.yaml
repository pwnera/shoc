id: endpoint_remote_control_tool_from_user_folder
title: NetSupport, Remote Utilities or MeshAgent ran from outside Program Files
description: >
  The NetSupport client (client32.exe), the Remote Utilities host (rutserv.exe,
  rfusclient.exe) or MeshAgent ran from a folder an installer does not use,
  such as AppData, ProgramData, Temp, Downloads or PerfLogs. Fake update and
  fake CAPTCHA chains drop a preconfigured NetSupport client into a user folder
  and use it as a remote-access trojan, and ransomware crews in 2026 install
  MeshAgent renamed after the victim company. On Defender a renamed copy is
  recognised by the file's version information. AnyDesk, TeamViewer and
  SimpleHelp are left out because their portable copies are how normal support
  sessions run; an MSP running NetSupport School from a share looks the same.
status: experimental
date: 2026-10-09
severity: high
confidence: 0.75
attack: [T1219, T1036.003, T1036.005]
