id: endpoint_security_tool_disabled
title: A command turned off antivirus, the EDR or Gatekeeper
description: >
  A command switched off Defender's real-time protection, by cmdlet or by policy
  value, deleted its signatures, removed the Defender feature, set it to allow
  what it detects or stripped its ransomware protections, stopped or unloaded
  the EDR's service, or turned Gatekeeper off. Intruders and ransomware crews do
  this before anything else; tamper protection often blocks it, and the attempt
  is still the signal.
status: experimental
date: 2026-10-02
modified: 2026-10-09
severity: high
confidence: 0.7
attack: [T1562.001]
