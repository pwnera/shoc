logsource:
  product: edr
  service: telemetry
detection:
  selection_process:
    class_uid: 1007
    activity_id: 1
  sel_mp_cmdlet:
    process.cmd_line|contains: [Set-MpPreference, Add-MpPreference]
  sel_mp_setting:
    process.cmd_line|contains: [DisableRealtimeMonitoring, DisableBehaviorMonitoring,
                                DisableIOAVProtection, DisableBlockAtFirstSeen,
                                DisableScriptScanning, DisableAntiSpyware, DisableAntiVirus,
                                DisableOnAccessProtection, DisableArchiveScanning,
                                DisableCloudProtection, DisableIntrusionPreventionSystem,
                                DisableNetworkProtection, DisableRoutinelyTakingAction,
                                DisableScanOnRealtimeEnable]
  sel_mp_true:
    process.cmd_line|contains: ['$true', ' 1']
  sel_sc_name:
    process.name: [sc.exe, net.exe, net1.exe]
  sel_sc_verb:
    process.cmd_line|contains: [' stop ', ' delete ', ' config ']
  sel_sc_target:
    process.cmd_line|contains: [WinDefend, WdNisSvc, Sense, CSFalconService, SentinelAgent,
                                WazuhSvc]
  sel_gatekeeper:
    process.name: spctl
    process.cmd_line|contains: [--master-disable, --global-disable]
  sel_unload_verb:
    process.name: [launchctl, systemctl, service]
    process.cmd_line|contains: [unload, bootout, ' stop', ' disable ', ' mask ']
  sel_unload_target:
    process.cmd_line|contains: [com.crowdstrike, falcon-sensor, com.sentinelone, sentinelone,
                                com.microsoft.wdav, mdatp, wazuh-agent]
  sel_vendor_cli:
    process.cmd_line|contains: [falconctl uninstall, sentinelctl unload,
                                real-time-protection --value disabled]
  # The same Defender policy values written with reg.exe or a .bat file.
  sel_reg:
    process.name: reg.exe
    process.cmd_line|contains: Windows Defender
  sel_reg_on:
    process.cmd_line|contains: ['/d 1', '/d "1"']
  # The protections that are off at 0.
  sel_reg_zero_name:
    process.cmd_line|contains: [EnableControlledFolderAccess, PUAProtection, MpEnablePus, SpynetReporting,
                                SubmitSamplesConsent, TamperProtection]
  sel_reg_zero:
    - process.cmd_line|contains: ['/d 0 ', '/d "0"']
    - process.cmd_line|endswith: '/d 0'
  sel_mpcmdrun:
    process.name: MpCmdRun.exe
    process.cmd_line|contains: -RemoveDefinitions
  sel_mpcmdrun_all:
    process.cmd_line|contains: ' -All'
  sel_feature:
    process.cmd_line|contains: [Uninstall-WindowsFeature, Remove-WindowsFeature]
  sel_feature_defender:
    process.cmd_line|contains: Windows-Defender
  # Defender still detects, then does nothing: 6 is Allow, 9 is NoAction.
  sel_default_allow:
    process.cmd_line|contains: ['ThreatDefaultAction Allow', 'ThreatDefaultAction NoAction',
                                'ThreatDefaultAction 6', 'ThreatDefaultAction 9', 'defac Allow',
                                'defac NoAction', 'defac 6', 'defac 9']
  # The Settings back end: RTP 1 turns real-time protection off.
  sel_ssaf:
    process.name: SystemSettingsAdminFlows.exe
    process.cmd_line|contains: defender
  sel_ssaf_off:
    process.cmd_line|contains: ['RTP 1', 'RealTimeProtection 1', 'SubmitSamplesConsent 0', 'SpyNetReporting 0']
  sel_remove_mp:
    process.cmd_line|contains: Remove-MpPreference
  sel_remove_mp_what:
    process.cmd_line|contains: [AttackSurfaceReductionRules_Ids, AttackSurfaceReductionRules_Actions,
                                ControlledFolderAccessProtectedFolders]
  condition: selection_process and ((sel_mp_cmdlet and sel_mp_setting and sel_mp_true) or (sel_sc_name and sel_sc_verb and sel_sc_target) or sel_gatekeeper or (sel_unload_verb and sel_unload_target) or sel_vendor_cli or (sel_reg and sel_mp_setting and sel_reg_on) or (sel_reg and sel_reg_zero_name and sel_reg_zero) or (sel_mpcmdrun and sel_mpcmdrun_all) or (sel_feature and sel_feature_defender) or (sel_mp_cmdlet and sel_default_allow) or (sel_ssaf and sel_ssaf_off) or (sel_remove_mp and sel_remove_mp_what))
  timeframe: 15m
entity: resource.uid
fields: [device.hostname, actor.user.name, process.name, process.cmd_line,
         process.parent_process.name, process.file.path]
