id: entra_app_credential_added
title: Secret, certificate or federated credential added to an application or service principal
description: >
  Someone added or changed a secret or certificate on an app registration or a
  service principal, or gave one a federated credential. A federated
  credential lets a GitHub workflow, or any OIDC issuer the attacker runs, sign
  in as the app with no secret at all. If the app already holds mail or
  directory permissions, either is a way back in that no user's password reset
  touches. Removing a federated credential is left out, though removing one of
  two still fires.
status: experimental
date: 2026-10-02
modified: 2026-10-09
severity: high
confidence: 0.6
attack: [T1098.001]
logsource:
  product: entra
  service: audit_logs
detection:
  selection:
    api.operation|contains: [certificates and secrets management, add service principal credentials]
  # The credentials are JSON text; a removal leaves "[]".
  selection_federated:
    api.operation|contains: [update application, update service principal]
    unmapped.modified.FederatedIdentityCredentials.newValue|contains: issuer
  filter_failed:
    status: Failure
  condition: (selection or selection_federated) and not filter_failed
  timeframe: 15m
entity: actor.user.name
fields: [actor.user.name, api.operation, resource.uid, src_endpoint.ip]
