id: entra_app_credential_added
title: Secret or certificate added to an application or service principal
description: >
  Someone added or changed a secret or certificate on an app registration or a
  service principal. If the app already holds mail or directory permissions,
  the new secret is a way back in that no user's password reset touches.
status: experimental
date: 2026-10-02
modified: 2026-10-03
severity: high
confidence: 0.6
attack: [T1098.001]
logsource:
  product: entra
  service: audit_logs
detection:
  selection:
    api.operation|contains: [certificates and secrets management, add service principal credentials]
  filter_failed:
    status: Failure
  condition: selection and not filter_failed
  timeframe: 15m
entity: actor.user.name
fields: [actor.user.name, api.operation, resource.uid, src_endpoint.ip]
sources:
  - name: Sigma
    title: Added Credentials to Existing Application
    url: https://github.com/SigmaHQ/sigma/blob/master/rules/cloud/azure/audit_logs/azure_app_credential_added.yml
    author: Mark Morowczynski '@markmorow', Bailey Bercik '@baileybercik'
    license: DRL-1.1
    relation: adapted
  - name: Elastic
    title: Entra ID Application Credential Modified
    url: https://www.elastic.co/docs/reference/security/prebuilt-rules/rules/integrations/azure/persistence_entra_id_application_credential_modification
    license: Elastic-2.0
    relation: inspired
  - name: Elastic
    title: Entra ID Service Principal Credentials Created by Unusual User
    url: https://www.elastic.co/docs/reference/security/prebuilt-rules/rules/integrations/azure/persistence_entra_id_service_principal_credentials_added
    license: Elastic-2.0
    relation: inspired
  - name: Microsoft
    title: Microsoft Entra audit log activity reference
    url: https://learn.microsoft.com/en-us/entra/identity/monitoring-health/reference-audit-activities
    relation: inspired
