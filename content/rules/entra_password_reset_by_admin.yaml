id: entra_password_reset_by_admin
title: Entra ID password reset by an administrator
description: >
  An administrator reset another user's password. Paired with an MFA change it
  is an account takeover in two steps. A reset from the admin center is logged
  twice, as Reset password (by admin) under the admin's name and as Reset user
  password under Microsoft's password reset service; the second is left out.
status: stable
date: 2026-09-24
modified: 2026-10-03
severity: medium
confidence: 0.55
attack: [T1098]
logsource:
  product: entra
  service: audit_logs
detection:
  selection:
    api.operation|contains: [reset user password, reset password (by admin)]
  filter_reset_service:
    actor.user.name: Microsoft password reset service
  condition: selection and not filter_reset_service
  timeframe: 15m
entity: actor.user.name
fields: [actor.user.name, resource.uid, src_endpoint.ip]
sources:
  - name: Microsoft
    title: Microsoft Entra audit log activity reference
    url: https://learn.microsoft.com/en-us/entra/identity/monitoring-health/reference-audit-activities
    relation: inspired
  - name: Microsoft Sentinel
    title: Bulk admin-initiated password reset across multiple accounts
    url: https://github.com/Azure/Azure-Sentinel/blob/master/Hunting%20Queries/AuditLogs/BulkPasswordResetByActor.yaml
    license: MIT
    relation: inspired
  - name: Azure-Hardening-IAM-Lab
    title: Entra audit log export of admin password resets (lab tenant)
    url: https://github.com/Inevitable-debug/Azure-Hardening-IAM-Lab/blob/main/logs/AuditLogs_2026-04-15%20(POST-HARDENING).csv
    relation: inspired
