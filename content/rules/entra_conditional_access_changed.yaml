id: entra_conditional_access_changed
title: Conditional access policy changed
description: >
  Conditional access is where MFA and device rules live. Changing or disabling
  a policy removes the control everything else assumes. A named location is
  often the exception a policy makes: an address range marked trusted skips
  MFA, and a deleted blocked-countries list lets those countries in.
status: stable
date: 2026-09-24
modified: 2026-10-09
severity: high
confidence: 0.75
attack: [T1562.001, T1556.009]
logsource:
  product: entra
  service: audit_logs
detection:
  selection:
    api.operation|contains: [conditional access policy, named location]
  condition: selection
  timeframe: 15m
entity: actor.user.name
fields: [actor.user.name, api.operation, resource.uid]
sources:
