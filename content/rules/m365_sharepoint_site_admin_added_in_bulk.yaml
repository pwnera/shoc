id: m365_sharepoint_site_admin_added_in_bulk
title: One account made site collection admin on several SharePoint or OneDrive sites
description: >
  One account added a site collection admin to three or more SharePoint sites
  or OneDrives within an hour. Site collection admin is full control of a site
  and every file in it, granted inside SharePoint rather than as an Entra role.
  In the SaaS ransomware attack Obsidian reported, the 0mega group gave the
  account it created site collection admin on many SharePoint sites. An admin
  taking over one leaver's OneDrive adds one site; walking the tenant adds many.
status: experimental
date: 2026-10-09
severity: high
confidence: 0.6
attack: [T1098, T1213.002]
logsource:
  product: m365
  service: management
detection:
  selection:
    api.operation: SiteCollectionAdminAdded
  filter_failed:
    status: Failure
  condition: selection and not filter_failed
  timeframe: 1h
  group_by: [actor.user.name]
  count_distinct: resource.uid
  count: ">= 3"
entity: actor.user.name
fields: [actor.user.name, resource.uid, src_endpoint.ip, http_request.user_agent]
sources:
  - name: Elastic
    title: M365 SharePoint Site Administrator Added
    url: https://github.com/elastic/detection-rules/blob/main/rules/integrations/o365/privilege_escalation_sharepoint_site_collection_admin_added.toml
    license: Elastic-2.0
    relation: inspired
  - name: Obsidian Security
    title: SaaS ransomware attack hit SharePoint Online without using a compromised endpoint
    url: https://obsidiansecurity.com/news/saas-ransomware-attack-hit-sharepoint-online-without-using-a-compromised-endpoint
    relation: inspired
  - name: Microsoft
    title: Audit log activities (site permissions activities)
    url: https://learn.microsoft.com/en-us/purview/audit-log-activities
    relation: inspired
