    title: Azure AD User ImmutableId Attribute Updated
    url: https://github.com/splunk/security_content/blob/develop/detections/cloud/azure_ad_user_immutableid_attribute_updated.yml
    author: Mauricio Velazco, Gowthamaraj Rajendran, Splunk
    license: Apache-2.0
    relation: adapted
