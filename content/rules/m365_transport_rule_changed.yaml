id: m365_transport_rule_changed
title: Exchange mail flow rule created, changed or removed
description: >
  A mail flow (transport) rule was created, changed, disabled or removed. One
  rule can copy every mailbox's mail to an outside address or strip a security
  header, and it takes only the Global Admin of a small tenant to write it.
status: experimental
date: 2026-10-02
modified: 2026-10-02
severity: high
confidence: 0.65
attack: [T1114.003, T1562.001]
logsource:
  product: m365
  service: management
detection:
  selection:
    api.operation: [New-TransportRule, Set-TransportRule, Remove-TransportRule, Disable-TransportRule]
  filter_failed:
    status: Failure
  condition: selection and not filter_failed
  timeframe: 15m
entity: actor.user.name
fields: [actor.user.name, api.operation, resource.uid, src_endpoint.ip]
sources:
  - name: Elastic
    title: M365 Exchange Mail Flow Transport Rule Created
    url: https://www.elastic.co/docs/reference/security/prebuilt-rules/rules/integrations/o365/exfiltration_exchange_transport_rule_creation
    license: Elastic-2.0
    relation: adapted
  - name: Elastic
    title: M365 Exchange Mail Flow Transport Rule Modified
    url: https://www.elastic.co/docs/reference/security/prebuilt-rules/rules/integrations/o365/exfiltration_exchange_transport_rule_modification
    license: Elastic-2.0
    relation: adapted
