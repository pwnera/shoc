id: anthropic_defence_disabled
title: Claude organisation protection or audit logging switched off
description: >
  The Compliance API or its activity logging was turned off, SSO or the
  magic-link second factor disabled, the IP restriction deleted, an API or
  extra-usage spend limit removed, or an Admin key deleted. The first blinds
  shoc's activity feed; the others open the Console, raise what a stolen key
  can cost, or remove shoc's own key. Editing a spend limit is logged as a
  delete and a create, so an edit matches too.
status: experimental
date: 2026-10-02
modified: 2026-10-03
severity: high
confidence: 0.6
attack: [T1562.008, T1556, T1562.007]
logsource:
  product: anthropic
  service: activity_feed
detection:
  selection_removed:
    api.operation:
      - org_ip_restriction_deleted
      - org_sso_connection_deactivated
      - org_sso_connection_deleted
      - extra_usage_spend_limit_deleted
      - platform_spend_limit_deleted
      - workspace_spend_limit_deleted
      - admin_api_key_deleted
  selection_toggled_off:
    api.operation: [org_sso_toggled, org_magic_link_second_factor_toggled]
    raw.enabled: "false"
  selection_logging_off:
    - api.operation: org_compliance_api_settings_updated
      raw.compliance_api_logging_enabled: "false"
    - api.operation: org_compliance_api_settings_updated
      raw.compliance_api_enabled: "false"
  condition: selection_*
  timeframe: 15m
# An Admin key that acts has no email, so its id keys the finding.
entity: [actor.user.name, actor.session.uid]
fields: [actor.user.name, src_endpoint.ip, api.operation, actor.session.uid]
