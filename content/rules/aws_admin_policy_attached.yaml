id: aws_admin_policy_attached
title: Administrator or IAM-wide permissions granted to a principal
description: >
  AdministratorAccess or IAMFullAccess was attached, a policy allowing every
  action or every IAM action was written inline or as a new version, an older
  policy version was made the default again, a permissions boundary was
  removed, or an IAM policy call was padded until CloudTrail dropped its
  parameters. Each one hands a principal the whole account.
status: stable
date: 2026-09-24
modified: 2026-10-02
severity: high
confidence: 0.7
attack: [T1098.003, T1548.005, T1562.008]
logsource:
  product: aws
  service: cloudtrail
detection:
  selection_managed:
    api.operation: [AttachUserPolicy, AttachRolePolicy, AttachGroupPolicy]
    raw.requestParameters.policyArn|endswith: [/AdministratorAccess, /IAMFullAccess]
  selection_inline:
    api.operation: [PutUserPolicy, PutRolePolicy, PutGroupPolicy, CreatePolicyVersion]
    raw.requestParameters.policyDocument|re: '"Action"\s*:\s*(\[[^\]]*)?"(\*|iam:\*)"'
  selection_rollback:
    api.operation: SetDefaultPolicyVersion
  selection_boundary_removed:
    api.operation: [DeleteUserPermissionsBoundary, DeleteRolePermissionsBoundary]
  selection_hidden:
    api.service.name: iam.amazonaws.com
    raw.requestParameters.omitted: true
  success:
    status: Success
  condition: success and selection_*
  timeframe: 15m
entity: actor.user.name
fields: [actor.user.name, api.operation, resource.uid, raw.requestParameters.policyArn, raw.requestParameters.userName, raw.requestParameters.roleName]
