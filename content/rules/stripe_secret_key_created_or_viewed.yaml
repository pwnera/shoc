id: stripe_secret_key_created_or_viewed
title: Stripe secret key created or its value viewed
description: >
  A secret key can refund, pay out and read every customer, and Stripe's API
  cannot revoke it: only a person in the dashboard can.
status: stable
date: 2026-09-30
modified: 2026-09-30
severity: high
confidence: 0.5
attack: [T1098.001, T1552]
logsource:
  product: stripe
  service: activity_log
detection:
  selection:
    api.operation: [api_key_created, api_key_viewed]
    raw.details.api_key.type: secret_key
  condition: selection
  timeframe: 15m
entity: actor.user.name
fields: [actor.user.name, resource.uid, cloud.account.uid]
