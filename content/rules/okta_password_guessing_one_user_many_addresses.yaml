id: okta_password_guessing_one_user_many_addresses
title: One Okta account's password failed from many addresses
description: >
  The password of one account failed from eight or more addresses within an
  hour. A credential stuffing run through residential proxies, like the wave
  Okta reported in April 2024, sends each attempt from a new address, so the
  rules that count per address stay quiet; counting per account catches the
  run aimed at one person, often an executive or an admin. A wrong push or
  one-time code is left out (whoever got that far had the password), and so
  is an old mail client on a phone retrying a stale password from whatever
  address the carrier gives it.
status: experimental
date: 2026-10-09
severity: medium
confidence: 0.6
attack: [T1110.001, T1110.004]
logsource:
  product: okta
  service: system_log
detection:
  selection:
    api.operation|startswith: [user.session.start, user.authentication.]
    status: Failure
    status_code: [INVALID_CREDENTIALS, LOCKED_OUT]
  filter_factor:
    raw.debugContext.debugData.factor|exists: true
  password_factor:
    raw.debugContext.debugData.factor: PASSWORD_AS_FACTOR
  rich_client:
    api.operation: user.authentication.auth_via_richclient
  condition: selection and not (filter_factor and not password_factor) and not rich_client
  timeframe: 1h
  group_by: [actor.user.name]
  count_distinct: src_endpoint.ip
  count: ">= 8"
entity: actor.user.name
fields: [actor.user.name, src_endpoint.ip, src_endpoint.asn, src_endpoint.location.country, http_request.user_agent]
sources:
  - name: Elastic
    title: Potential Okta Brute Force (Multi-Source)
    url: https://www.elastic.co/docs/reference/security/prebuilt-rules/rules/integrations/okta/credential_access_okta_brute_force_multi_source
    license: Elastic-2.0
    relation: inspired
  - name: Okta
    title: How to Block Anonymizing Services using Okta
    url: https://sec.okta.com/articles/blockanonymizers/
    relation: inspired
