id: aws_console_password_set_for_user
title: Console password created for an IAM user
description: >
  A login profile gives an IAM user interactive console access. On accounts
  that use SSO, nobody should need one.
status: stable
date: 2026-09-24
modified: 2026-09-24
severity: high
confidence: 0.7
attack: [T1098.001]
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    api.operation: [CreateLoginProfile, UpdateLoginProfile]
    status: Success
  condition: selection
  timeframe: 15m
entity: actor.user.name
fields: [actor.user.name, api.operation, src_endpoint.ip]
