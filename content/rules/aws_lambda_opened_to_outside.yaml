id: aws_lambda_opened_to_outside
title: Lambda function or layer opened to anyone or to another account
description: >
  A function URL was created without authentication, or a function or layer
  permission was granted to anyone or to an account. An open function is a
  backdoor that runs code with the function's role. A grant to the function's
  own account by its bare id is not a match.
status: experimental
date: 2026-10-02
modified: 2026-10-03
severity: medium
confidence: 0.55
attack: [T1546, T1133]
logsource:
  product: aws
  service: cloudtrail
detection:
  selection_url:
    api.operation|startswith: [CreateFunctionUrlConfig, UpdateFunctionUrlConfig]
    raw.requestParameters.authType: NONE
  selection_any_principal:
    api.operation|startswith: [AddPermission, AddLayerVersionPermission]
    raw.requestParameters.principal: "*"
  selection_account_principal:
    api.operation|startswith: [AddPermission, AddLayerVersionPermission]
    raw.requestParameters.principal|re: '^([0-9]{12}|arn:aws:iam::[0-9]{12}:.*)$'
  # A bare account id that is the function's own account.
  own_account:
    raw.requestParameters.principal|fieldref: cloud.account.uid
  success:
    status: Success
  condition: success and selection_* and not own_account
  timeframe: 15m
entity: actor.user.name
fields: [actor.user.name, api.operation, resource.uid, raw.requestParameters.functionName, raw.requestParameters.layerName, raw.requestParameters.principal]
sources:
