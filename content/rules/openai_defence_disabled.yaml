id: openai_defence_disabled
title: OpenAI IP allowlist, SSO, SCIM or mutual TLS switched off
description: >
  The organisation's IP allowlist was deleted, deactivated or opened to every
  address, SCIM provisioning was disabled or its deletion requested, the SSO
  connection or the session policy was deleted, or mutual TLS certificates
  were deactivated. Without the allowlist or mutual TLS a stolen key or
  session works from anywhere; without SSO a password login does; without SCIM
  a person removed from the IdP keeps their account.
status: experimental
date: 2026-10-02
modified: 2026-10-09
severity: high
confidence: 0.6
attack: [T1562.007, T1556]
logsource:
  product: openai
  service: audit_log
detection:
  selection:
    api.operation:
      - ip_allowlist.deleted
      - ip_allowlist.config.deactivated
      - scim.disabled
      - tenant.scim.deletion.requested
      - tenant.sso_connection.deleted
      - tenant.session_policy.deleted
      - certificates.deactivated
  selection_opened:
    api.operation: ip_allowlist.updated
    raw.details.allowed_ips|contains: ["0.0.0.0/0", "::/0"]
  condition: selection or selection_opened
  timeframe: 15m
entity: actor.user.name
fields: [actor.user.name, src_endpoint.ip, api.operation, raw.details.allowed_ips]
sources:
  - name: Elastic
    title: Anthropic Organization IP Restriction Deleted
    url: https://github.com/elastic/detection-rules/blob/main/rules/integrations/anthropic/defense_evasion_anthropic_organization_ip_restriction_deleted.toml
    license: Elastic-2.0
    relation: inspired
  - name: Monad
    title: Detection Engineering for OpenAI Enterprise Audit Logs
    url: https://www.monad.com/blog/openai-enterprise-audit-log-detections
    relation: inspired
  - name: Panther
    title: OpenAI SCIM Configuration Change
    url: https://github.com/panther-labs/panther-analysis/blob/develop/rules/openai_rules/openai_scim_configuration_change.yml
    license: Apache-2.0
    relation: inspired
  - name: OpenAI
    title: OpenAI API OpenAPI specification (AuditLog)
    url: https://github.com/openai/openai-openapi/blob/main/openapi.yaml
    relation: inspired
