id: azure_nsg_opened_to_internet
title: Azure network security rule opens an admin port to the whole internet
description: >
  An inbound allow rule from any address (*, Internet, 0.0.0.0/0) to SSH, RDP,
  SMB, WinRM, a database port or every port was written to a network security
  group. Scanners find an open RDP or SSH port within hours, and it is a common
  ransomware entry for a small company running one or two Azure VMs; the VM
  wizard's "Allow selected ports" writes exactly this rule. Web ports are left
  out. When a whole group is written with its rules inline, the source and the
  port can come from two different rules in it.
status: experimental
date: 2026-10-09
severity: high
confidence: 0.55
attack: [T1562.007]
logsource:
  product: azure
  service: activity
detection:
  selection:
    api.operation: [Microsoft.Network/networkSecurityGroups/securityRules/write,
                    Microsoft.Network/networkSecurityGroups/write]
  # The rule rides on the request that starts the write and on the response
  # that accepts it.
  from_anywhere:
    - raw.properties.requestbody|re:
        - '"sourceAddressPrefix"\s*:\s*"(\*|0\.0\.0\.0/0|::/0|[Ii]nternet|[Aa]ny)"'
        - '"sourceAddressPrefixes"\s*:\s*\[[^\]]*"(\*|0\.0\.0\.0/0|::/0|[Ii]nternet|[Aa]ny)"'
    - raw.properties.responseBody|re:
        - '"sourceAddressPrefix"\s*:\s*"(\*|0\.0\.0\.0/0|::/0|[Ii]nternet|[Aa]ny)"'
        - '"sourceAddressPrefixes"\s*:\s*\[[^\]]*"(\*|0\.0\.0\.0/0|::/0|[Ii]nternet|[Aa]ny)"'
  admin_port:
    - raw.properties.requestbody|re:
        - '"destinationPortRange"\s*:\s*"(\*|0-65535|1-65535|22|23|135|139|445|1433|3306|3389|5432|5985|5986)"'
        - '"destinationPortRanges"\s*:\s*\[[^\]]*"(0-65535|1-65535|22|23|135|139|445|1433|3306|3389|5432|5985|5986)"'
    - raw.properties.responseBody|re:
        - '"destinationPortRange"\s*:\s*"(\*|0-65535|1-65535|22|23|135|139|445|1433|3306|3389|5432|5985|5986)"'
        - '"destinationPortRanges"\s*:\s*\[[^\]]*"(0-65535|1-65535|22|23|135|139|445|1433|3306|3389|5432|5985|5986)"'
  inbound:
    - raw.properties.requestbody|re: '"direction"\s*:\s*"[Ii]nbound"'
    - raw.properties.responseBody|re: '"direction"\s*:\s*"[Ii]nbound"'
  allow:
    - raw.properties.requestbody|re: '"access"\s*:\s*"[Aa]llow"'
    - raw.properties.responseBody|re: '"access"\s*:\s*"[Aa]llow"'
  # A whole group's response adds Azure's default rules, whose DenyAllInBound
  # reads as any source to any port; only its request is read.
  filter_group_response:
    api.operation: Microsoft.Network/networkSecurityGroups/write
    raw.properties.requestbody|exists: false
  filter_failed:
    status: Failure
  condition: selection and from_anywhere and admin_port and inbound and allow and not filter_group_response and not filter_failed
  timeframe: 15m
entity: actor.user.name
fields: [actor.user.name, resource.uid, src_endpoint.ip, cloud.account.uid]
