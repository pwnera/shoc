id: google_two_step_verification_disabled
title: Two-step verification turned off
description: >
  Second factors were removed for a user, an admin turned two-step
  verification off for someone, or an admin stopped allowing or enforcing it
  for an org unit. Everything that depends on MFA quietly stops depending on it.
status: stable
date: 2026-09-24
modified: 2026-10-03
severity: critical
confidence: 0.75
attack: [T1556.006]
logsource:
  product: google
  service: reports
detection:
  selection_unenroll:
    api.operation|contains: [unenroll_user_from_strong_auth, turn_off_2_step_verification]
  # Turning 2SV on is the same event name with NEW_VALUE true.
  selection_off:
    api.operation: [ENFORCE_STRONG_AUTHENTICATION, ALLOW_STRONG_AUTHENTICATION]
    unmapped.params.NEW_VALUE: false
  # A user turning their own second factor off.
  selection_user:
    api.operation: 2sv_disable
  condition: selection_unenroll or selection_off or selection_user
  timeframe: 15m
entity: actor.user.name
fields: [actor.user.name, api.operation, resource.uid]
sources:
  - name: Elastic
    title: Google Workspace MFA Enforcement Disabled For Organization
    url: https://www.elastic.co/docs/reference/security/prebuilt-rules/rules/integrations/google_workspace/impact_google_workspace_mfa_enforcement_disabled
    license: Elastic-2.0
    relation: inspired
  - name: Elastic
    title: Google Workspace 2SV Policy Disabled By User
    url: https://www.elastic.co/docs/reference/security/prebuilt-rules/rules/integrations/google_workspace/persistence_google_workspace_2sv_policy_disabled
    license: Elastic-2.0
    relation: inspired
  - name: Sigma
    title: Google Workspace MFA Disabled
    url: https://github.com/SigmaHQ/sigma/blob/master/rules/cloud/gcp/gworkspace/admin/gcp_gworkspace_mfa_disabled.yml
    author: Austin Songer
    license: DRL-1.1
    relation: adapted
  - name: Google
    title: Admin audit activity events, user settings
    url: https://developers.google.com/workspace/admin/reports/v1/appendix/activity/admin-user-settings
    relation: inspired
