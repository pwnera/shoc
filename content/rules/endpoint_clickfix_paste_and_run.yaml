logsource:
  product: edr
  service: telemetry
detection:
  # Defender only: Falcon's ASEP events and Cloud Funnel's default categories
  # do not cover RunMRU.
  sel_runmru:
    raw.category: AdvancedHunting-DeviceRegistryEvents
    raw.properties.RegistryKey|contains: RunMRU
    raw.properties.RegistryValueData|contains: [powershell, pwsh, mshta, curl, msiexec, conhost, rundll32,
                                                bitsadmin, forfiles, finger, certutil, cmd, wscript,
                                                cscript, regsvr32]
  # People type a bare "powershell" or a URL into Run; a pasted lure fetches or decodes.
  # finger asks a remote host for the next command.
  sel_runmru_fetch:
    raw.properties.RegistryValueData|contains: ['http', 'iex ', 'iex(', '|iex', '| iex', 'irm ', 'iwr ',
                                                Invoke-WebRequest, Invoke-RestMethod, DownloadString,
                                                DownloadFile, FromBase64String, '-w h', '@ssl', '^',
                                                'finger ', DavWWWRoot]
  sel_child:
    class_uid: 1007
    activity_id: 1
    process.parent_process.name: explorer.exe
    process.name: [powershell.exe, pwsh.exe, mshta.exe, cmd.exe, conhost.exe, msiexec.exe, rundll32.exe]
  # 'iex' alone is inside every msiexec command line. '@SSL\', '@80\' and
  # DavWWWRoot are a WebDAV share, which carries no 'http'.
  sel_child_fetch:
    process.cmd_line|contains: ['http://', 'https://', 'iex ', 'iex(', '|iex', '| iex', 'irm ', 'iwr ',
                                Invoke-WebRequest, Invoke-RestMethod, DownloadString, '@SSL\', '@80\',
                                DavWWWRoot]
  # The part after "#" is the lure the person sees; the fetch hides in base64 or a variable.
  sel_comment:
    process.cmd_line|contains: '#'
  sel_lure_word:
    process.cmd_line|contains: [captcha, robot, human, verify, verification, validation, botcheck, anti-bot]
  # FileFix: pasted into a browser's file-upload dialog, so the browser starts it.
  sel_browser_child:
    class_uid: 1007
    activity_id: 1
    process.parent_process.name: [chrome.exe, msedge.exe, firefox.exe, brave.exe]
    process.name: [powershell.exe, pwsh.exe, cmd.exe, mshta.exe, conhost.exe]
    process.cmd_line|contains: '#'
  # Wiping the Run box history the Defender branch reads.
  sel_runmru_delete:
    class_uid: 1007
    activity_id: 1
    process.name: reg.exe
    process.cmd_line|contains: ' del'
  sel_runmru_key:
    process.cmd_line|contains: '\Explorer\RunMRU'
  condition: (sel_runmru and sel_runmru_fetch) or (sel_child and (sel_child_fetch or (sel_comment and sel_lure_word))) or sel_browser_child or (sel_runmru_delete and sel_runmru_key)
  timeframe: 1h
entity: resource.uid
fields: [device.hostname, actor.user.name, process.name, process.cmd_line,
         raw.properties.RegistryValueData]
