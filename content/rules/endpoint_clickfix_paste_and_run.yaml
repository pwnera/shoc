id: endpoint_clickfix_paste_and_run
title: A command pasted into the Run box or a browser's file dialog ran code
description: >
  Explorer started PowerShell, mshta, cmd, conhost, msiexec or rundll32 with a
  command that fetches code from the internet or a WebDAV share, or that hides
  behind a "#" comment saying it verifies a human; a browser started one of them
  with a "#" comment (FileFix, pasted into the file-upload dialog); the Run box
  history holds such a command; or reg.exe wiped that history. Fake CAPTCHA
  pages ("ClickFix") get people to paste exactly this, and it is the main way
  Windows infostealers arrive.
status: experimental
date: 2026-10-02
modified: 2026-10-09
severity: high
confidence: 0.6
attack: [T1204.004, T1059.001, T1218.005, T1189]
