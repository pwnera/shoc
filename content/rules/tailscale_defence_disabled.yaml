id: tailscale_defence_disabled
title: Tailnet protection switched off
description: >
  Device approval, user approval, Tailnet Lock, SCIM, device posture
  collection, network flow logs or log streaming was turned off, a device
  posture integration was removed or edited, the log stream was pointed
  somewhere else, or the security contact email changed. Each one lets a
  device or a person onto the network, or out of sight, without anyone being
  asked.
status: stable
date: 2026-09-30
modified: 2026-10-09
severity: high
confidence: 0.65
attack: [T1562.001]
logsource:
  product: tailscale
  service: configuration_log
detection:
  # Tailscale's API schema names the properties MACHINE_APPROVAL_NEEDED,
  # USER_APPROVAL_REQUIRED, TKA (Tailnet Lock), SCIM, COLLECT_POSTURE_IDENTITY,
  # NETWORK_FLOW_LOGGING and LOG_EXIT_FLOWS. Datadog's rule names Tailnet Lock
  # TAILNET_LOCK, so both are matched until a real record settles it.
  selection:
    api.operation|startswith: TAILNET.DISABLE.
    api.operation|contains: [APPROVAL, TAILNET_LOCK, TKA, SCIM, POSTURE, FLOW]
  # Posture checks in the access policy read what the integration reports.
  selection_posture:
    api.operation: [TAILNET.DELETE.POSTURE_INTEGRATION, TAILNET.UPDATE.POSTURE_INTEGRATION]
  # Tailscale sends its security notices for the tailnet to this address.
  selection_contact:
    api.operation: TAILNET.UPDATE.SECURITY_EMAIL
  # The stream (LOGSTREAM_ENDPOINT) was deleted or its destination changed.
  selection_logstream:
    api.operation|startswith: [TAILNET.DELETE.LOGSTREAM, TAILNET.UPDATE.LOGSTREAM]
  condition: selection or selection_posture or selection_contact or selection_logstream
  timeframe: 15m
entity: actor.user.name
fields: [actor.user.name, api.operation, cloud.account.uid]
sources:
  - name: Elastic
    title: GCP Logging Sink Modification
    url: https://www.elastic.co/docs/reference/security/prebuilt-rules/rules/integrations/gcp/exfiltration_gcp_logging_sink_modification
