id: entra_mailbox_sync_app_used
title: Mailbox opened with a tool BEC actors use to copy it
description: >
  An account signed in with, or consented to, PerfectData Software, eM Client,
  Newsletter Software Supermailer, CloudSponge, SigParser or rclone. After a
  takeover the attacker points one of these ordinary desktop tools at the
  victim's mailbox or OneDrive; it copies everything and keeps syncing after a
  password reset until its token is revoked. Huntress, Darktrace, Datadog and
  Triskele Labs name them in business email compromise cases, and none has a
  reason to appear in a small company. A failed sign-in counts too, since
  nobody tries these tools against an account by accident. A person who really
  reads their mail in eM Client shows up on the first day and is suppressed for
  that user once someone confirms it.
status: experimental
date: 2026-10-09
severity: high
confidence: 0.65
attack: [T1114.002, T1528]
logsource:
  product: entra
detection:
  # PerfectData Software, eM Client, rclone: the apps whose ids are known.
  selection_app_id:
    - raw.appId: [ff8d92dc-3d82-41d6-bcbd-b9174d163620, e9a7fea1-1cc0-4cd9-a31b-9137ca5deedd,
                  b15665d9-eda6-4092-8539-0eec376afd59]
    - raw.properties.appId: [ff8d92dc-3d82-41d6-bcbd-b9174d163620, e9a7fea1-1cc0-4cd9-a31b-9137ca5deedd,
                             b15665d9-eda6-4092-8539-0eec376afd59]
  # The rest by the name a sign-in carries as its app.
  selection_app_name:
    api.operation: [PerfectData Software, eM Client, Newsletter Software Supermailer, CloudSponge,
                    SigParser, rclone]
  # A consent names the app as its target.
  selection_consent:
    api.operation|contains: consent to application
    resource.uid: [PerfectData Software, eM Client, Newsletter Software Supermailer, CloudSponge,
                   SigParser, rclone]
  condition: selection_app_id or selection_app_name or selection_consent
  timeframe: 1h
entity: actor.user.name
fields: [actor.user.name, api.operation, resource.uid, src_endpoint.ip, src_endpoint.asn, status]
sources:
