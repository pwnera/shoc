id: aws_offensive_tool_user_agent
title: AWS API called by a secret scanner or offensive distribution
description: >
  A call came from TruffleHog, from a Kali, Parrot or Pentoo machine, or from
  S3 Browser touching IAM. The distribution shows in the AWS CLI's `distrib#`
  tag, and Kali also in the kernel release the CLI and SDKs report, such as
  `Linux/5.15.0-kali3-amd64`. Whoever harvests a key from a public repository
  checks it with TruffleHog first, so this is often the earliest event of a
  leaked key.
status: experimental
date: 2026-10-02
modified: 2026-10-03
severity: high
confidence: 0.85
attack: [T1078.004, T1087.004]
logsource:
  product: aws
  service: cloudtrail
detection:
  selection_tool:
    http_request.user_agent|contains: [trufflehog, "distrib#kali", "+kali", "-kali", "distrib#parrot", "distrib#pentoo"]
  selection_s3browser_iam:
    http_request.user_agent|contains: "s3 browser"
    api.service.name: iam.amazonaws.com
  condition: selection_tool or selection_s3browser_iam
  timeframe: 15m
entity: actor.session.uid
fields: [actor.user.name, actor.session.uid, src_endpoint.ip, http_request.user_agent, api.operation]
sources:
  - name: Elastic
    title: AWS Suspicious User Agent Fingerprint
