id: defender_browser_credential_file_read
title: A program other than the browser read its saved passwords or cookies
description: >
  Defender saw a program that is not a browser read a browser's password,
  cookie or key file, including Login Data For Account, where Chrome keeps the
  passwords saved to the Google account. Infostealers do this to take saved
  passwords and live sessions; only Defender records the read.
status: experimental
date: 2026-10-02
modified: 2026-10-09
severity: high
confidence: 0.6
attack: [T1555.003, T1539]
sources:
  - name: Sigma
    title: "Access To Browser Credential Files By Uncommon Applications"
    url: https://github.com/SigmaHQ/sigma/blob/master/rules-threat-hunting/windows/file/file_access/file_access_win_browsers_credential.yml
    author: "frack113, X__Junior (Nextron Systems)"
    license: DRL-1.1
    relation: adapted
  - name: Sigma
    title: "Suspicious File Access to Browser Credential Storage"
    url: https://github.com/SigmaHQ/sigma/blob/master/rules/windows/file/file_access/file_access_win_susp_process_access_browser_cred_files.yml
    author: "frack113, X__Junior (Nextron Systems), Swachchhanda Shrawan Poudel (Nextron Systems), Parth-FourCore"
    license: DRL-1.1
    relation: inspired
  - name: Elastic
    title: "Suspicious Web Browser Sensitive File Access"
    url: https://github.com/elastic/detection-rules/blob/main/rules/macos/credential_access_suspicious_web_browser_sensitive_file_access.toml
    license: Elastic-2.0
    relation: inspired
logsource:
  product: edr
  service: telemetry
detection:
  selection:
    raw.category: AdvancedHunting-DeviceEvents
    api.operation: SensitiveFileRead
    raw.properties.FileName: [Login Data, Login Data For Account, Cookies, Local State, Web Data, key4.db,
                              logins.json, cookies.sqlite]
  filter_browsers:
    process.name: [chrome.exe, msedge.exe, msedgewebview2.exe, firefox.exe, brave.exe, opera.exe,
                   vivaldi.exe, MsMpEng.exe, MsSense.exe, SenseNdr.exe]
  condition: selection and not filter_browsers
  timeframe: 1h
entity: device.hostname
fields: [device.hostname, actor.user.name, process.name, process.cmd_line, process.file.path,
         raw.properties.FileName, raw.properties.FolderPath]
