    url: https://github.com/Azure/Azure-Sentinel/blob/master/Hunting%20Queries/AuditLogs/BitLockerKeyRetrieval.yaml
    license: MIT
    relation: adapted
  - name: Microsoft
    title: Microsoft Entra security operations for devices
    url: https://learn.microsoft.com/en-us/entra/architecture/security-operations-devices
    relation: inspired
