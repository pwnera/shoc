id: entra_auth_policy_changed
title: Authentication, PIM or device registration policy changed
description: >
  Someone changed which sign-in methods the tenant accepts, the PIM settings
  that gate admin roles, a PIM alert, the risk and MFA registration policy, or
  who may register devices. Each one quietly lowers the bar for the next
  sign-in, which is why attackers change them before they need them.
status: experimental
date: 2026-10-02
modified: 2026-10-02
severity: high
confidence: 0.6
attack: [T1556.009, T1562.001]
logsource:
  product: entra
  service: audit_logs
detection:
  selection:
    api.operation|contains:
      - update role setting in pim
      - disable pim alert
      - authentication methods policy update
      - update user risk and mfa registration policy
      - set device registration policies
  filter_failed:
    status: Failure
  condition: selection and not filter_failed
  timeframe: 15m
entity: actor.user.name
fields: [actor.user.name, api.operation, resource.uid, src_endpoint.ip]
sources:
  - name: Sigma
    title: Changes To PIM Settings
    url: https://github.com/SigmaHQ/sigma/blob/master/rules/cloud/azure/audit_logs/azure_pim_change_settings.yml
    author: Mark Morowczynski '@markmorow', Yochana Henderson, '@Yochana-H'
    license: DRL-1.1
    relation: adapted
  - name: Sigma
