id: entra_auth_policy_changed
title: Authentication, PIM or device registration policy changed
description: >
  Someone changed which sign-in methods the tenant accepts, the PIM settings
  that gate admin roles, a PIM alert, the risk and MFA registration policy, or
  who may register devices. Each one quietly lowers the bar for the next
  sign-in, which is why attackers change them before they need them. Turning
  off Microsoft's block on users consenting to risky apps does the same, and
  so do a change to the per-user MFA settings (trusted addresses that skip MFA,
  app passwords) and a new certificate authority whose certificates can then
  sign anyone in.
status: experimental
date: 2026-10-02
modified: 2026-10-09
severity: high
confidence: 0.6
attack: [T1556.009, T1562.001]
logsource:
  product: entra
  service: audit_logs
detection:
  selection:
    api.operation|contains:
      - update role setting in pim
      - disable pim alert
      - authentication methods policy update
      - update user risk and mfa registration policy
      - set device registration policies
  selection_consent:
    api.operation|contains: update authorization policy
    unmapped.modified.AllowUserConsentForRiskyApps.newValue|contains: 'true'
  # Company settings change in one record; these two name the per-user MFA
  # settings and the trusted certificate authorities.
  selection_company:
    api.operation|contains: set company information
  company_sign_in:
    - raw.targetResources|contains: [StrongAuthenticationPolicy, TrustedCAsForPasswordlessAuth]
    - raw.properties.targetResources|contains: [StrongAuthenticationPolicy, TrustedCAsForPasswordlessAuth]
  filter_failed:
    status: Failure
  condition: (selection or selection_consent or (selection_company and company_sign_in)) and not filter_failed
  timeframe: 15m
entity: actor.user.name
fields: [actor.user.name, api.operation, resource.uid, src_endpoint.ip]
