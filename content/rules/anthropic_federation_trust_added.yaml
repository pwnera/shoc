    relation: inspired
  - name: Sigma
    title: New Federated Domain Added
    url: https://github.com/SigmaHQ/sigma/blob/master/rules/cloud/m365/audit/microsoft365_new_federated_domain_added_audit.yml
    author: Splunk Threat Research Team (original rule), Harjot Singh @cyb3rjy0t (sigma rule)
    license: DRL-1.1
    relation: inspired
  - name: Push Security
    title: Inbound federation
    url: https://github.com/pushsecurity/saas-attacks/blob/main/techniques/inbound_federation/description.md
    license: CC-BY-4.0
    relation: inspired
