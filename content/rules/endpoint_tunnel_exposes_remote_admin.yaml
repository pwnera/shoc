logsource:
  product: edr
  service: telemetry
detection:
  selection_process:
    class_uid: 1007
    activity_id: 1
  sel_tool:
    process.cmd_line|contains: [ngrok, cloudflared, plink, ssh, chisel, frpc, bore, localtonet,
                                pinggy, devtunnel, zrok]
  sel_port:
    process.cmd_line|re: '(:|\s|//)(3389|445|5985|5986)(\s|"|$)'
  sel_rdp_scheme:
    process.cmd_line|contains: ['rdp://', 'smb://']
  # The Cloudflare Access client opens a local port to a remote server's RDP.
  filter_access_client:
    process.cmd_line|contains: [' access rdp ', ' access tcp ']
  sel_portproxy:
    process.name: netsh.exe
    process.cmd_line|contains: portproxy
  sel_portproxy_target:
    process.cmd_line|contains: ['connectport=3389', 'connectport=445', 'connectport=5985', 'connectport=5986']
  condition: selection_process and ((sel_tool and (sel_port or sel_rdp_scheme) and not filter_access_client) or (sel_portproxy and sel_portproxy_target))
  timeframe: 1h
entity: resource.uid
fields: [device.hostname, actor.user.name, process.name, process.cmd_line,
         process.parent_process.name, process.file.path]
