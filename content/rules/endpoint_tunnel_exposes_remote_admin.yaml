id: endpoint_tunnel_exposes_remote_admin
title: A tunnel published this machine's Remote Desktop, SMB or WinRM to the internet
description: >
  A tunnel tool (ngrok, cloudflared, plink, ssh, chisel, Dev Tunnels, zrok) was
  pointed at port 3389, 445, 5985 or 5986, or Windows' own port forwarder
  (netsh portproxy) was set to relay to one of them. That opens Remote Desktop,
  file sharing or remote PowerShell past the firewall; developers tunnel web
  ports.
status: experimental
date: 2026-10-02
modified: 2026-10-09
severity: high
confidence: 0.75
attack: [T1572, T1133, T1021.001]
