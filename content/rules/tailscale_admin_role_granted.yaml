id: tailscale_admin_role_granted
title: Tailscale user or group made an owner or an admin
description: >
  An admin edits the access policy, approves devices and mints keys for the
  whole tailnet. A role given to a group reaches everyone the identity
  provider puts in it. The billing admin role, which cannot touch the
  network, is left out.
status: stable
date: 2026-09-30
modified: 2026-10-09
severity: high
confidence: 0.6
attack: [T1098]
sources:
  - name: Tailscale
    title: Configuration audit logging
    url: https://tailscale.com/docs/features/logging/audit-logging
    relation: inspired
  - name: Tailscale
    title: Tailscale API OpenAPI schema (audit event names)
    url: https://api.tailscale.com/api/v2?outputOpenapiSchema=true
    relation: inspired
logsource:
  product: tailscale
  service: configuration_log
detection:
  selection:
    api.operation: [USER.UPDATE.USER_ROLE, GROUP.UPDATE.USER_ROLE]
  privileged:
    raw.new|contains: [admin, owner]
  billing:
    raw.new: billing-admin
  condition: selection and privileged and not billing
  timeframe: 15m
entity: actor.user.name
fields: [actor.user.name, resource.uid, cloud.account.uid]
