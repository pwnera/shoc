id: aws_rds_password_reset_or_made_public
title: RDS master password reset, or a database made or restored publicly reachable
description: >
  A database's master password was reset, a database was made publicly
  accessible, or a snapshot was restored as a public database. Someone with
  AWS admin rights signs in to the database this way, or copies it out from
  outside, with no snapshot share or export for other rules to see. A person
  resetting a forgotten password or restoring a public test copy matches too,
  and only they can say it was them. Passwords RDS rotates itself in Secrets
  Manager do not match, and neither does a new database created public, which
  startups do for development.
status: experimental
date: 2026-10-09
severity: high
confidence: 0.65
attack: [T1098, T1578.002, T1530]
logsource:
  product: aws
  service: cloudtrail
detection:
  # CloudTrail logs the new password as "****".
  selection_password:
    api.operation: [ModifyDBInstance, ModifyDBCluster]
    raw.requestParameters.masterUserPassword|exists: true
  selection_made_public:
    api.operation: [ModifyDBInstance, ModifyDBCluster]
    raw.requestParameters.publiclyAccessible: true
  # A restore may leave the flag out and take it from the subnet group, so
  # the response says whether the copy is public.
  selection_public_restore:
    api.operation: [RestoreDBInstanceFromDBSnapshot, RestoreDBInstanceToPointInTime, RestoreDBClusterFromSnapshot]
    raw.responseElements.publiclyAccessible: true
  scope:
    api.service.name: rds.amazonaws.com
    status: Success
  filter_aws:
    actor.invoked_by|exists: true
  condition: scope and selection_* and not filter_aws
  timeframe: 15m
entity: actor.user.name
fields: [actor.user.name, actor.session.uid, src_endpoint.ip, api.operation, raw.requestParameters.dBInstanceIdentifier, raw.requestParameters.dBClusterIdentifier]
