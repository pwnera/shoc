id: endpoint_ci_runner_or_secret_scanner_on_workstation
title: A GitHub runner was registered, TruffleHog scanned the disk, or a container wrote the host's sudoers
description: >
  A machine registered itself as a self-hosted GitHub Actions runner,
  TruffleHog swept its file system for secrets, or a privileged container with
  the host's root mounted wrote to sudoers, shadow or root's SSH keys. The 2025
  npm worms (Shai-Hulud) did all three on developer laptops: steal every token
  on disk, keep a backdoor that runs whatever a workflow sends it, and use
  Docker to give themselves root. No build step writes the host's sudoers.
status: experimental
date: 2026-10-02
modified: 2026-10-09
severity: high
confidence: 0.7
attack: [T1195.002, T1552.001, T1219, T1611]
sources:
  - name: Elastic
    title: "Remote GitHub Actions Runner Registration"
    url: https://github.com/elastic/detection-rules/blob/main/rules/cross-platform/execution_register_github_actions_runner.toml
    license: Elastic-2.0
    relation: inspired
  - name: Elastic
    title: "Credential Access via TruffleHog Execution"
    url: https://github.com/elastic/detection-rules/blob/main/rules/cross-platform/credential_access_trufflehog_execution.toml
    license: Elastic-2.0
    relation: inspired
  - name: Wiz Research
    title: "Shai-Hulud 2.0: Ongoing Supply Chain Attack"
    url: https://www.wiz.io/blog/shai-hulud-2-0-ongoing-supply-chain-attack
    relation: inspired
logsource:
  product: edr
  service: telemetry
detection:
  selection_process:
    class_uid: 1007
    activity_id: 1
  sel_runner:
    process.name: [Runner.Listener, Runner.Listener.exe]
    process.cmd_line|contains: configure
  sel_runner_url:
    process.cmd_line|contains: --url
  sel_runner_token:
    process.cmd_line|contains: --token
  sel_trufflehog:
    process.name: [trufflehog, trufflehog.exe]
    process.cmd_line|contains: filesystem
  sel_docker:
    process.cmd_line|contains: docker
  sel_docker_privileged:
    process.cmd_line|contains: --privileged
  sel_docker_host_root:
    process.cmd_line|contains: ['-v /:/', '--volume /:/', '--volume=/:/']
  sel_docker_root_files:
    process.cmd_line|contains: [sudoers, /etc/shadow, /root/.ssh]
  condition: selection_process and ((sel_runner and sel_runner_url and sel_runner_token) or sel_trufflehog or (sel_docker and sel_docker_privileged and sel_docker_host_root and sel_docker_root_files))
  timeframe: 1h
entity: resource.uid
fields: [device.hostname, actor.user.name, process.name, process.cmd_line,
         process.parent_process.name, process.file.path]
