id: endpoint_ci_runner_or_secret_scanner_on_workstation
title: A GitHub runner was registered or TruffleHog scanned the disk
description: >
  A machine registered itself as a self-hosted GitHub Actions runner, or
  TruffleHog swept its file system for secrets. The 2025 npm worms (Shai-Hulud)
  did both on developer laptops: steal every token on disk, then keep a
  backdoor that runs whatever a workflow sends it.
status: experimental
date: 2026-10-02
severity: high
confidence: 0.7
attack: [T1195.002, T1552.001, T1219]
sources:
  - name: Elastic
    title: "Remote GitHub Actions Runner Registration"
    url: https://github.com/elastic/detection-rules/blob/main/rules/cross-platform/execution_register_github_actions_runner.toml
    license: Elastic-2.0
    relation: inspired
  - name: Elastic
    title: "Credential Access via TruffleHog Execution"
    url: https://github.com/elastic/detection-rules/blob/main/rules/cross-platform/credential_access_trufflehog_execution.toml
    license: Elastic-2.0
    relation: inspired
logsource:
  product: edr
  service: telemetry
detection:
  selection_process:
    class_uid: 1007
    activity_id: 1
  sel_runner:
    process.name: [Runner.Listener, Runner.Listener.exe]
    process.cmd_line|contains: configure
  sel_runner_url:
    process.cmd_line|contains: --url
  sel_runner_token:
    process.cmd_line|contains: --token
  sel_trufflehog:
    process.name: [trufflehog, trufflehog.exe]
    process.cmd_line|contains: filesystem
  condition: selection_process and ((sel_runner and sel_runner_url and sel_runner_token) or sel_trufflehog)
  timeframe: 1h
entity: resource.uid
fields: [device.hostname, actor.user.name, process.name, process.cmd_line,
         process.parent_process.name, process.file.path]
