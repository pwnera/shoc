id: github_secret_changed
title: Actions secret created or updated
description: >
  Secrets in CI are credentials to everything CI can reach. A new one, or a
  changed one, deserves a glance. Dependabot and Codespaces secrets count too;
  removing a secret does not fire.
status: stable
date: 2026-09-24
modified: 2026-10-03
severity: medium
confidence: 0.5
attack: [T1552, T1078.004]
logsource:
  product: github
  service: audit_log
detection:
  # Actions, Dependabot and Codespaces secrets of the organisation, a repository or an environment.
  selection:
    api.operation|endswith: [.create_actions_secret, .update_actions_secret, .create_integration_secret, .update_integration_secret]
  condition: selection
  timeframe: 15m
entity: actor.user.name
fields: [actor.user.name, api.operation, resource.uid, raw.key]
sources:
  - name: Sigma
    title: Github New Secret Created
    url: https://github.com/SigmaHQ/sigma/blob/master/rules/application/github/audit/github_new_secret_created.yml
    author: Muhammad Faisal (@faisalusuf)
    license: DRL-1.1
    relation: adapted
  - name: GitHub
    title: Audit log events for your organization
    url: https://docs.github.com/en/enterprise-cloud@latest/organizations/keeping-your-organization-secure/managing-security-settings-for-your-organization/audit-log-events-for-your-organization
    relation: inspired
