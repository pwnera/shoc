id: macos_password_prompt_or_browser_key_read
title: A script asked for the Mac password, or read a browser's keychain key or the whole keychain
description: >
  A script opened a password prompt, checked a typed password with dscl, read
  the keychain entry a browser encrypts its saved passwords and cookies with,
  dumped the keychain with security dump-keychain, or copied the login
  keychain file. That is how macOS infostealers (Atomic, Poseidon, Banshee,
  MacSync, Shub) take every SaaS session on a founder's laptop; the script
  stealers copy login.keychain-db into their /tmp folder next to the browser
  profiles.
status: experimental
date: 2026-10-02
modified: 2026-10-09
severity: high
confidence: 0.75
attack: [T1056.002, T1555.001, T1555.003]
