id: macos_password_prompt_or_browser_key_read
title: A script asked for the Mac password or read a browser's keychain key
description: >
  A script opened a password prompt, checked a typed password with dscl, or read
  the keychain entry a browser encrypts its saved passwords and cookies with.
  That is how macOS infostealers (Atomic, Poseidon, Banshee) take every SaaS
  session on a founder's laptop.
status: experimental
date: 2026-10-02
modified: 2026-10-03
severity: high
confidence: 0.75
attack: [T1056.002, T1555.001, T1555.003]
sources:
  - name: Elastic
    title: "Prompt for Credentials with Osascript"
    url: https://github.com/elastic/detection-rules/blob/main/rules/macos/credential_access_promt_for_pwd_via_osascript.toml
    license: Elastic-2.0
    relation: inspired
  - name: Elastic
    title: "Keychain Password Retrieval via Command Line"
    url: https://github.com/elastic/detection-rules/blob/main/rules/macos/credential_access_keychain_pwd_retrieval_security_cmd.toml
    license: Elastic-2.0
    relation: inspired
  - name: Sigma
    title: "GUI Input Capture - macOS"
    url: https://github.com/SigmaHQ/sigma/blob/master/rules/macos/process_creation/proc_creation_macos_gui_input_capture.yml
    author: "remotephone, oscd.community"
    license: DRL-1.1
    relation: adapted
  - name: Trend Micro
    title: "An MDR Analysis of the AMOS Stealer Campaign Targeting macOS via Cracked Apps"
    url: https://www.trendmicro.com/en_us/research/25/i/an-mdr-analysis-of-the-amos-stealer-campaign.html
    relation: inspired
logsource:
  product: edr
  service: telemetry
detection:
  selection_process:
    class_uid: 1007
    activity_id: 1
  selection_prompt:
    process.name: osascript
    process.cmd_line|contains: display dialog
  selection_prompt_words:
    process.cmd_line|contains: [password, passphrase, hidden answer, authenticate]
  # Atomic runs its prompt from a script file, then tests the password it got.
  selection_authcheck:
    process.name: dscl
    process.cmd_line|contains: authonly
  selection_keychain:
    process.name: security
    process.cmd_line|contains: [find-generic-password, find-internet-password]
  # Each Chromium browser keeps its key as "<Browser> Safe Storage".
  selection_browser:
    process.cmd_line|contains: [Chrome, Chromium, Brave, Microsoft Edge, Opera, Vivaldi,
                                Safe Storage]
  condition: selection_process and ((selection_prompt and selection_prompt_words) or selection_authcheck or (selection_keychain and selection_browser))
  timeframe: 15m
entity: resource.uid
fields: [device.hostname, actor.user.name, process.name, process.cmd_line,
         process.parent_process.name, process.file.path]
