logsource:
  product: edr
  service: telemetry
detection:
  selection_process:
    class_uid: 1007
    activity_id: 1
  selection_prompt:
    process.name: osascript
    process.cmd_line|contains: display dialog
  selection_prompt_words:
    process.cmd_line|contains: [password, passphrase, hidden answer, authenticate]
  # Atomic runs its prompt from a script file, then tests the password it got.
  selection_authcheck:
    process.name: dscl
    process.cmd_line|contains: authonly
  selection_keychain:
    process.name: security
    process.cmd_line|contains: [find-generic-password, find-internet-password]
  # Each Chromium browser keeps its key as "<Browser> Safe Storage".
  selection_browser:
    process.cmd_line|contains: [Chrome, Chromium, Brave, Microsoft Edge, Opera, Vivaldi,
                                Safe Storage]
  selection_dump:
    process.name: security
    process.cmd_line|contains: dump-keychain
  selection_keychain_copy:
    process.name: [cp, ditto, zip, tar, rsync, osascript]
    process.cmd_line|contains: login.keychain-db
  condition: selection_process and ((selection_prompt and selection_prompt_words) or selection_authcheck or (selection_keychain and selection_browser) or selection_dump or selection_keychain_copy)
  timeframe: 15m
entity: resource.uid
fields: [device.hostname, actor.user.name, process.name, process.cmd_line,
         process.parent_process.name, process.file.path]
