    url: https://www.elastic.co/docs/reference/security/prebuilt-rules/rules/integrations/aws/resource_development_ses_account_sending_enabled
    license: Elastic-2.0
    relation: adapted
  - name: Elastic
    title: AWS SES Full Access Policy Attached to IAM Entity by Unusual User
    url: https://www.elastic.co/docs/reference/security/prebuilt-rules/rules/integrations/aws/persistence_iam_ses_fullaccess_policy_attached_by_unusual_user
    license: Elastic-2.0
    relation: inspired
  - name: Delicious Brains
