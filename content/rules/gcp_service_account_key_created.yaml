id: gcp_service_account_key_created
title: GCP service account key created
description: >
  A key file was made for a service account, or a public key uploaded to one.
  A key file works from anywhere and, by default, never expires, so making one
  after a console takeover keeps access through a password reset.
status: experimental
date: 2026-10-02
modified: 2026-10-02
severity: high
confidence: 0.55
attack: [T1098.001]
logsource:
  product: gcp
  service: audit
detection:
  selection:
    api.operation|endswith: [CreateServiceAccountKey, UploadServiceAccountKey]
    status: Success
  condition: selection
  timeframe: 15m
entity: actor.user.name
fields: [actor.user.name, src_endpoint.ip, resource.uid, cloud.account.uid, raw.protoPayload.response.name]
sources:
  - name: Elastic
    title: GCP Service Account Key Creation
    url: https://www.elastic.co/docs/reference/security/prebuilt-rules/rules/integrations/gcp/persistence_gcp_key_created_for_service_account
    license: Elastic-2.0
    relation: inspired
