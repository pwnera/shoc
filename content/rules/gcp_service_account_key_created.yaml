id: gcp_service_account_key_created
title: GCP service account key or Cloud Storage HMAC key created
description: >
  A key file was made for a service account, a public key uploaded to one, or
  a Cloud Storage HMAC key made for an account. A key file works from
  anywhere and, by default, never expires, so making one after a console
  takeover keeps access through a password reset. An HMAC key is the Cloud
  Storage version, an access key and secret that any S3 client can use.
status: experimental
date: 2026-10-02
modified: 2026-10-09
severity: high
confidence: 0.55
attack: [T1098.001]
logsource:
  product: gcp
  service: audit
detection:
  selection:
    api.operation|endswith: [CreateServiceAccountKey, UploadServiceAccountKey]
    status: Success
  # Read from the permission the call used, so a deployment that makes the
  # key on someone's behalf counts too.
  selection_hmac:
    raw.protoPayload.authorizationInfo|contains: storage.hmacKeys.create
    status: Success
  condition: selection or selection_hmac
  timeframe: 15m
entity: actor.user.name
fields: [actor.user.name, src_endpoint.ip, resource.uid, cloud.account.uid, raw.protoPayload.response.name]
sources:
  - name: Elastic
    title: GCP Service Account Key Creation
    url: https://www.elastic.co/docs/reference/security/prebuilt-rules/rules/integrations/gcp/persistence_gcp_key_created_for_service_account
    license: Elastic-2.0
    relation: inspired
  - name: Panther
    title: GCP storage hmac keys create
    url: https://github.com/panther-labs/panther-analysis/blob/develop/rules/gcp_audit_rules/gcp_storage_hmac_keys_create.py
    license: Apache-2.0
    relation: adapted
