id: m365_inbox_rule_created
title: Mailbox rule that forwards, deletes or hides mail
description: >
  An inbox rule now forwards, redirects or deletes mail, or moves it to a folder
  nobody reads (RSS Feeds, Conversation History), whether it was made in Outlook
  on the web, PowerShell, EWS or the Outlook desktop app. In business email
  compromise this is how the attacker reads the replies and hides them from the
  real owner. Rules that only file mail into an ordinary folder, Archive
  included, are left to the hunt.
status: stable
date: 2026-09-24
modified: 2026-10-03
severity: high
confidence: 0.7
attack: [T1114.003, T1564.008]
logsource:
  product: m365
  service: management
detection:
  selection_owa:
    api.operation: [New-InboxRule, Set-InboxRule]
  # A parameter set to nothing clears that action, and reads as absent.
  owa_action:
    - unmapped.params.ForwardTo|exists: true
    - unmapped.params.ForwardAsAttachmentTo|exists: true
    - unmapped.params.RedirectTo|exists: true
    - unmapped.params.DeleteMessage: true
    - unmapped.params.SoftDeleteMessage: true
    # Conversation History is named in the mailbox's language.
    - unmapped.params.MoveToFolder|contains: [RSS, Conversation History, Deleted Items, Historique des conversations,
                                              Verlauf der Unterhaltung, Historial de conversaciones,
                                              Cronologia delle conversazioni, Gesprekgeschiedenis,
                                              Histórico de Conversações]
  selection_outlook:
    api.operation: UpdateInboxRules
  # Outlook writes RuleActions ("ActionType":"Forward"); EWS writes Actions
  # (ForwardToRecipientsAction, RedirectToRecipientsAction, DeleteAction).
  outlook_action:
    - unmapped.opprops.RuleActions|contains: [Forward, Redirect, Delete]
    - unmapped.opprops.Actions|contains: [Forward, Redirect, Delete]
  filter_rule_removed:
    unmapped.opprops.RuleOperation: [RemoveMailboxRule, Delete]
  filter_failed:
    status: Failure
  condition: >-
    ((selection_owa and owa_action) or (selection_outlook and outlook_action and not filter_rule_removed))
    and not filter_failed
  timeframe: 15m
entity: actor.user.name
fields: [actor.user.name, api.operation, src_endpoint.ip, resource.uid]
