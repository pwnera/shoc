logsource:
  product: edr
  service: telemetry
detection:
  selection_process:
    class_uid: 1007
    activity_id: 1
  sel_shadow_tool:
    process.name: [vssadmin.exe, wmic.exe, powershell.exe, pwsh.exe, diskshadow.exe]
  sel_shadow_word:
    process.cmd_line|contains: shadow
  sel_delete_word:
    process.cmd_line|contains: delete
  # A scheduled cleanup removes the oldest copy; crews delete them all.
  filter_oldest:
    process.cmd_line|contains: /oldest
  sel_wmi_class:
    process.cmd_line|contains: Win32_ShadowCopy
  sel_wmi_remove:
    process.cmd_line|contains: [Remove-WmiObject, Remove-CimInstance, rwmi, rcim, .Delete()]
  # Deleting older backup versions with -keepVersions:N is routine upkeep.
  sel_wbadmin:
    process.name: wbadmin.exe
    process.cmd_line|contains: delete
  sel_wbadmin_all:
    process.cmd_line|contains: [catalog, 'keepversions:0']
  sel_bcdedit:
    process.name: bcdedit.exe
    process.cmd_line|contains: set
  sel_bcd_recovery_off:
    process.cmd_line|contains: recoveryenabled
  sel_bcd_no:
    process.cmd_line|contains: ' no'
  sel_bcd_ignore:
    process.cmd_line|contains: ignoreallfailures
  # Ryuk and Conti shrink the storage so Windows purges every copy.
  sel_resize:
    process.cmd_line|contains: resize shadowstorage
  sel_resize_small:
    process.cmd_line|contains: ['maxsize=401mb', 'maxsize=1mb']
  sel_reagentc:
    process.name: reagentc.exe
    process.cmd_line|contains: [/disable, -disable]
  sel_cipher:
    process.name: cipher.exe
    process.cmd_line|contains: ' /w:'
  condition: selection_process and ((sel_shadow_tool and sel_shadow_word and sel_delete_word and not filter_oldest) or (sel_wmi_class and sel_wmi_remove) or (sel_wbadmin and sel_wbadmin_all) or (sel_bcdedit and ((sel_bcd_recovery_off and sel_bcd_no) or sel_bcd_ignore)) or (sel_resize and sel_resize_small) or sel_reagentc or sel_cipher)
  timeframe: 15m
entity: resource.uid
fields: [device.hostname, actor.user.name, process.name, process.cmd_line,
         process.parent_process.name, process.file.path]
