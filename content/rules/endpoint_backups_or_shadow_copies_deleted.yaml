id: endpoint_backups_or_shadow_copies_deleted
title: Shadow copies, Windows backups or boot recovery were deleted or turned off
description: >
  A command deleted the Volume Shadow Copies (vssadmin, wmic, PowerShell WMI) or
  shrank their storage so Windows drops them, deleted the Windows Server Backup
  catalog or every backup version, turned off boot recovery (bcdedit) or the
  Windows Recovery Environment (reagentc), or overwrote the disk's free space
  (cipher /w). Ransomware crews do this minutes before they encrypt, so the
  company's fastest way back is gone. Deleting only the oldest copy is left out;
  repairing the recovery partition also runs reagentc /disable.
status: experimental
date: 2026-10-09
severity: critical
confidence: 0.85
attack: [T1490, T1485]
