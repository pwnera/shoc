id: google_marketplace_app_installed
title: A Marketplace app was installed for the whole Google Workspace domain
description: >
  An admin installed a Marketplace app for the domain. It gets its scopes for
  every user without a consent screen, the same reach as domain-wide
  delegation.
status: experimental
date: 2026-10-02
severity: medium
confidence: 0.55
attack: [T1098.001]
logsource:
  product: google
  service: reports
detection:
  selection:
    api.operation: ADD_APPLICATION
  condition: selection
  timeframe: 15m
entity: actor.user.name
fields: [actor.user.name, resource.uid, src_endpoint.ip]
sources:
  - name: Elastic
    title: Application Added to Google Workspace Domain
    url: https://www.elastic.co/docs/reference/security/prebuilt-rules/rules/integrations/google_workspace/persistence_application_added_to_google_workspace_domain
    license: Elastic-2.0
    relation: adapted
