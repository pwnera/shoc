    title: Anthropic Service Key Created
    url: https://github.com/panther-labs/panther-analysis/blob/develop/rules/anthropic_rules/anthropic_service_key_created.yml
    license: Apache-2.0
    relation: adapted
  - name: Anthropic
    title: Query compliance activities
    url: https://platform.claude.com/docs/en/api/compliance/activities/list
    relation: inspired
