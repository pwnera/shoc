id: aws_federation_token_used
title: Access key exchanged for a federated console session
description: >
  An IAM user called GetFederationToken and, within ten minutes, a federated
  session issued by that user signed in to the console. Tools that turn a
  stolen key into a console session do exactly this, and the session keeps
  working after the key is disabled. The sign-in can come from another
  address than the token request, as when a chat app previews the sign-in
  link. A key that mints federation tokens without signing in is left to the
  first-use hunt.
status: experimental
date: 2026-10-02
modified: 2026-10-03
severity: high
confidence: 0.7
attack: [T1550.001, T1078.004]
logsource:
  product: aws
  service: cloudtrail
detection:
  token:
    api.operation: GetFederationToken
    status: Success
  console:
    api.operation: ConsoleLogin
    actor.user.type: FederatedUser
    status: Success
  # A federated session names the IAM user that issued it, so both events
  # carry that user; the federated name is the caller's choice.
  sequence:
    by: [actor.user.name]
    first: token
    then: console
    within: 10m
  timeframe: 15m
entity: actor.user.name
fields: [actor.user.name, actor.user.uid, actor.session.uid, src_endpoint.ip, http_request.user_agent]
