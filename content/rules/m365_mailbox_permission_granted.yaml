id: m365_mailbox_permission_granted
title: Mailbox permission granted to another account
description: >
  Someone was given access to another person's mailbox, or the right to send
  on their behalf, or a mail folder was opened to everyone in the company. It
  is a normal delegation and a normal exfiltration path. Mandiant lists read
  access for the Default or Anonymous user on mail folders among APT29's
  techniques, since any account in the tenant can then read them. Grants
  Exchange makes itself when it provisions a shared mailbox, and a calendar
  shared with the whole company, are left out.
status: stable
date: 2026-09-24
modified: 2026-10-09
severity: high
confidence: 0.6
attack: [T1098.002]
logsource:
  product: m365
  service: management
detection:
  selection:
    api.operation: [Add-MailboxPermission, Add-RecipientPermission, Add-MailboxFolderPermission, Add-ADPermission]
  selection_send_on_behalf:
    api.operation: Set-Mailbox
    unmapped.params.GrantSendOnBehalfTo|exists: true
  # Default and Anonymous are on every folder already, so the cmdlet changes
  # them rather than adding them; the mailbox audit names both Everyone.
  selection_folder_cmdlet:
    api.operation: Set-MailboxFolderPermission
    unmapped.params.User: [Default, Anonymous]
    unmapped.params.AccessRights|contains: [Read, Reviewer, Author, Editor, Owner]
  selection_folder_audit:
    api.operation: [AddFolderPermissions, ModifyFolderPermissions]
    raw.Item.ParentFolder.MemberUpn: [Everyone, Default, Anonymous]
    raw.Item.ParentFolder.MemberRights|contains: ReadAny
  filter_calendar:
    - unmapped.params.Identity|contains: [Calend, Kalender, Agenda]
    - raw.Item.ParentFolder.Path|contains: [Calend, Kalender, Agenda]
  filter_system:
    actor.user.name|startswith: NT AUTHORITY
  filter_failed:
    status: Failure
  condition: >-
    (selection or selection_send_on_behalf
    or ((selection_folder_cmdlet or selection_folder_audit) and not filter_calendar))
    and not filter_system and not filter_failed
  timeframe: 15m
entity: actor.user.name
fields: [actor.user.name, api.operation, resource.uid]
sources:
