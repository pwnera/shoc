logsource:
  product: edr
  service: alerts
detection:
  # Activity types: 3001 a hash exclusion added by a user; 3008 to 3011 a new
  # path, signer, file type or browser exclusion; 3012 to 3015 one changed;
  # 3020 a hash taken off the blocklist; 3602 a custom rule deleted; 3603 a
  # custom rule's status changed; 64 an agent's passphrase viewed.
  selection:
    metadata.product.name: SentinelOne
    raw.activityType: ['3001', '3008', '3009', '3010', '3011', '3012', '3013', '3014', '3015', '3020',
                       '3602', '3603', '64']
  condition: selection
  timeframe: 1h
entity: actor.user.name
fields: [actor.user.name, message, raw.data.exclusionType, raw.data.value, raw.data.osFamily,
         raw.data.groupName, raw.data.ruleName, raw.data.computerName]
