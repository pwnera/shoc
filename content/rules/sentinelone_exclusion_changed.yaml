id: sentinelone_exclusion_changed
title: A SentinelOne exclusion, blocklist entry or custom rule was weakened, or an agent passphrase was read
description: >
  Someone in the SentinelOne console added or changed an exclusion, so the agent
  no longer looks at a path, a file or a process; took a hash off the
  blocklist; deleted a custom detection rule or switched one on or off; or
  viewed an agent's passphrase, which is what disabling or removing the agent
  on the machine itself takes. It is what an intruder with a console account
  does before running their tools, and what an admin does to quiet a noisy
  application. Uninstalling an agent is left out, since retiring a laptop does
  that.
status: experimental
date: 2026-10-02
modified: 2026-10-09
severity: medium
confidence: 0.6
attack: [T1562.001]
