    relation: inspired
  - name: Microsoft Sentinel
    title: "Sentinel One - Blacklist hash deleted"
    url: https://github.com/Azure/Azure-Sentinel/blob/master/Solutions/SentinelOne/Analytic%20Rules/SentinelOneBlacklistHashDeleted.yaml
    license: MIT
    relation: adapted
  - name: Microsoft Sentinel
