id: github_mass_clone
title: One account cloned ten or more private repositories in ten minutes
description: >
  Cloning every private repository is how a stolen token or a departing
  engineer takes the code. Distinct repositories are counted, so a CI user
  that clones the same repository on every job stays quiet. Bots are left out.
  Audit-log API on Enterprise Cloud only.
status: experimental
date: 2026-10-02
modified: 2026-10-02
severity: high
confidence: 0.45
attack: [T1213.003, T1567.001]
logsource:
  product: github
  service: audit_log
detection:
  selection:
    api.operation: git.clone
    raw.repository_public: "false"
  filter_bots:
    actor.user.name|endswith: "[bot]"
  condition: selection and not filter_bots
  timeframe: 10m
  group_by: [actor.user.name]
  count_distinct: resource.uid
  count: ">= 10"
entity: actor.user.name
fields: [actor.user.name, actor.session.uid, src_endpoint.ip, resource.uid, raw.programmatic_access_type]
sources:
  - name: Elastic
    title: GitHub Exfiltration via High Number of Repository Clones by User
    url: https://www.elastic.co/docs/reference/security/prebuilt-rules/rules/integrations/github/exfiltration_high_number_of_cloning_by_user
    license: Elastic-2.0
    relation: inspired
  - name: Elastic
    title: High Number of Cloned GitHub Repos From PAT
    url: https://www.elastic.co/docs/reference/security/prebuilt-rules/rules/integrations/github/execution_github_high_number_of_cloned_repos_from_pat
    license: Elastic-2.0
    relation: adapted
