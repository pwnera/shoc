id: endpoint_unix_shell_download_and_run
title: A Linux or Mac shell ran code fetched from a raw IP, decoded from base64, or started by a web server or Script Editor
description: >
  A shell on a Linux server or a Mac ran one of these: a download from a raw IP
  address piped into a shell or run through bash -c "$(curl ...)", a base64
  blob decoded straight into a shell, a download into /tmp or /dev/shm made
  executable and run in one command, curl or wget started by a web server or a
  Node or Java process, or curl started by Script Editor or osascript. Droppers
  after a web exploit (React2Shell, Confluence, the Next.js and PHP waves of
  2025 and 2026) and the macOS paste-into-Terminal and Script Editor lures all
  look like this. Homebrew, rustup and Docker install the same way, but from a
  domain and from a person's terminal, so no branch matches them. A pipeline
  typed into an interactive shell runs as separate processes, none of which
  carries the whole line; the rule sees the sh -c and bash -c lines that
  droppers, exploits, AppleScript and pasted lures produce.
status: experimental
date: 2026-10-09
severity: high
confidence: 0.7
attack: [T1059.004, T1105, T1204.004, T1190]
