logsource:
  product: edr
  service: telemetry
detection:
  selection_process:
    class_uid: 1007
    activity_id: 1
  sel_fetch:
    process.cmd_line|contains: ['curl ', 'wget ', /curl, /wget]
  # "| sh", "|bash", "| sudo zsh", "| /bin/bash", but not "| shasum".
  sel_to_shell:
    process.cmd_line|re: '\|\s*(sudo\s+)?(/usr)?(/bin/)?(ba|z|da)?sh(\s|$|"|''|\))'
  sel_fetch_subst:
    process.cmd_line|contains: ['$(curl', '$(wget', '`curl', '`wget']
  sel_shell_c:
    process.name: [sh, bash, zsh, dash]
    process.cmd_line|contains: ' -c '
  sel_b64:
    process.cmd_line|contains: base64
  sel_b64_decode:
    process.cmd_line|contains: [' -d', ' --decode', ' -D']
  sel_cmd_subst:
    process.cmd_line|contains: ['$(echo', '$(printf', '`echo']
  sel_ip_url:
    process.cmd_line|re: '(http|https|ftp)://[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}'
  # cloud-init and internal provisioning fetch from private addresses.
  filter_private_url:
    process.cmd_line|contains: ['://127.', '://10.', '://192.168.', '://169.254.', '://172.16.', '://172.17.',
                                '://172.18.', '://172.19.', '://172.20.', '://172.21.', '://172.22.', '://172.23.',
                                '://172.24.', '://172.25.', '://172.26.', '://172.27.', '://172.28.', '://172.29.',
                                '://172.30.', '://172.31.']
  sel_tmp:
    process.cmd_line|contains: [/tmp/, /dev/shm/, /var/tmp/]
  sel_exec_bit:
    process.cmd_line|contains: ['chmod +x', 'chmod 777', 'chmod 755', 'chmod 700', 'chmod u+x', 'chmod a+x']
  sel_unquarantine:
    process.cmd_line|contains: ['xattr -c', com.apple.quarantine]
  sel_devshm:
    process.cmd_line|contains: /dev/shm/
  sel_server_parent:
    process.parent_process.name: [node, nginx, httpd, apache2, php-fpm, php-cgi, php, java, bun]
  sel_applescript_parent:
    process.parent_process.name: [Script Editor, osascript, applet]
  condition: selection_process and ((sel_b64 and sel_b64_decode and (sel_to_shell or (sel_shell_c and sel_cmd_subst))) or (sel_fetch and (sel_to_shell or sel_fetch_subst) and sel_ip_url and not filter_private_url) or (sel_fetch and sel_tmp and sel_exec_bit and ((sel_ip_url and not filter_private_url) or sel_unquarantine or sel_devshm)) or (sel_server_parent and sel_fetch and (sel_to_shell or sel_tmp)) or (sel_applescript_parent and sel_fetch))
  timeframe: 1h
entity: resource.uid
fields: [device.hostname, actor.user.name, process.name, process.cmd_line, process.parent_process.name,
         process.file.path]
