id: m365_exchange_role_assigned
title: Exchange or Purview admin role given to an account or app
description: >
  Someone was given an Exchange or Purview role, joined a role group such as
  Organization Management or eDiscovery Manager, or an app was registered in
  Exchange and given a role such as Application Mail.ReadWrite. Exchange keeps
  its own permissions beside Entra ID, so none of this shows as an Entra role
  change, yet Organization Management or an unscoped app role reaches every
  mailbox. An app role works with no user and survives every password reset.
  Changes Exchange makes itself are left out.
status: experimental
date: 2026-10-09
severity: high
confidence: 0.6
attack: [T1098.002, T1098.003]
logsource:
  product: m365
  service: management
detection:
  selection:
    api.operation:
      - New-ManagementRoleAssignment
      - Add-RoleGroupMember
      - Update-RoleGroupMember
      - New-RoleGroup
      - New-ServicePrincipal
  filter_system:
    actor.user.name|startswith: NT AUTHORITY
  filter_failed:
    status: Failure
  condition: selection and not filter_system and not filter_failed
  timeframe: 15m
entity: actor.user.name
fields: [actor.user.name, api.operation, resource.uid, unmapped.params.Role, unmapped.params.User,
         unmapped.params.App, unmapped.params.Member, src_endpoint.ip]
sources:
