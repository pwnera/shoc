id: entra_app_granted_mailbox_or_directory_permission
title: App granted access to every mailbox or to directory roles
description: >
  An application was given an application permission that reads or sends mail
  in any mailbox (full_access_as_app, Exchange.ManageAsApp, Mail.Read and its
  variants, Mail.Send, MailboxSettings.ReadWrite), or one that lets it rewrite
  the directory (RoleManagement.ReadWrite.Directory,
  AppRoleAssignment.ReadWrite.All, Application.ReadWrite.All,
  Directory.ReadWrite.All). Midnight Blizzard read Microsoft's corporate mail
  through apps it had given full_access_as_app, and the directory permissions
  let an app make itself Global Administrator. An application permission works with no user
  signed in, so no password reset touches it. entra_app_consent_granted fires on
  the same grant; this is the one to act on first. A backup or archiving
  product installed by a named admin is the usual benign case.
status: experimental
date: 2026-10-09
severity: critical
confidence: 0.8
attack: [T1098.003, T1114.002, T1528]
logsource:
  product: entra
  service: audit_logs
detection:
  selection:
    api.operation|contains: add app role assignment to service principal
    # The permission's name, written as JSON text with its quotes.
    unmapped.modified.AppRole_Value.newValue|contains:
      [full_access_as_app, Exchange.ManageAsApp, Mail.Read, Mail.Send, MailboxSettings.ReadWrite,
       RoleManagement.ReadWrite.Directory, AppRoleAssignment.ReadWrite.All,
       Application.ReadWrite.All, Directory.ReadWrite.All]
  filter_failed:
    status: Failure
  condition: selection and not filter_failed
  timeframe: 15m
entity: actor.user.name
fields: [actor.user.name, resource.uid, unmapped.modified.AppRole_Value.newValue,
         unmapped.modified.ServicePrincipal_DisplayName.newValue, src_endpoint.ip]
