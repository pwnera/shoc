id: m365_domain_federation_changed
title: Domain federation changed (Microsoft 365 audit)
description: >
  A domain was switched to federated sign-in, its federation settings were
  changed, or a federated domain was added in Exchange. Whoever controls the
  federation's signing key can sign in as any user of that domain without a
  password or MFA. This copy of the Entra rule covers tenants that connect only
  Microsoft 365.
status: experimental
date: 2026-10-02
modified: 2026-10-02
severity: critical
confidence: 0.8
attack: [T1484.002, T1556.007]
logsource:
  product: m365
  service: management
detection:
  selection_directory:
    api.operation|contains: [set domain authentication, set federation settings on domain]
  selection_exchange:
    api.operation: Add-FederatedDomain
  filter_failed:
    status: Failure
  condition: (selection_directory or selection_exchange) and not filter_failed
  timeframe: 15m
entity: actor.user.name
fields: [actor.user.name, api.operation, resource.uid, src_endpoint.ip]
sources:
  - name: Elastic
    title: Entra ID Domain Federation Configuration Change
    url: https://www.elastic.co/docs/reference/security/prebuilt-rules/rules/integrations/azure/privilege_escalation_entra_id_tenant_domain_federation_via_audit_logs
    license: Elastic-2.0
    relation: adapted
  - name: Sigma
    title: New Federated Domain Added - Exchange
    url: https://github.com/SigmaHQ/sigma/blob/master/rules/cloud/m365/exchange/microsoft365_new_federated_domain_added_exchange.yml
    author: Splunk Threat Research Team (original rule), '@ionsor (rule)'
    license: DRL-1.1
    relation: adapted
