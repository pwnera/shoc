id: github_secret_leaked
title: Secret found in a repository
description: >
  Secret scanning found a credential committed to a repository, found it
  leaked publicly, or someone pushed one past push protection on purpose. Until
  it is revoked at its provider, anyone who read the repository can use it.
status: stable
date: 2026-09-30
modified: 2026-10-02
severity: high
confidence: 0.7
attack: [T1552.001]
logsource:
  product: github
  service: audit_log
detection:
  selection:
    api.operation: [secret_scanning_alert.create, secret_scanning_alert.public_leak]
  # Webhook organisations get the bypass as an alert with push_protection_bypassed.
  selection_bypass:
    api.operation|contains: secret_scanning_push_protection.bypass
  condition: selection or selection_bypass
  timeframe: 15m
entity: resource.uid
fields: [resource.uid, api.operation, actor.user.name]
sources:
  - name: Sigma
    title: Github Push Protection Bypass Detected
    url: https://github.com/SigmaHQ/sigma/blob/master/rules/application/github/audit/github_push_protection_bypass_detected.yml
    author: Muhammad Faisal (@faisalusuf)
    license: DRL-1.1
    relation: adapted
