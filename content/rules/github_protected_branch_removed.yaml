id: github_protected_branch_removed
title: Branch protection removed or overridden
description: >
  Protection was removed from a branch, a policy was overridden, or a ruleset
  was deleted or switched from active to disabled or evaluate. It lets code
  reach the default branch without review, which is a supply-chain foothold. A
  push that protection refused is protection working and does not fire, nor
  does editing a ruleset that was already off.
status: stable
date: 2026-09-24
modified: 2026-10-03
severity: high
confidence: 0.7
attack: [T1562.001, T1195]
logsource:
  product: github
  service: audit_log
detection:
  selection:
    api.operation|contains: protected_branch
  filter_create_or_blocked:
    api.operation|contains: [protected_branch.create, protected_branch.rejected_ref_update]
  # Every protection on a repository switched off at once.
  selection_all_off:
    api.operation: repository_branch_protection_evaluation.disable
  # Rulesets replaced classic branch protection; deleting one removes it.
  selection_ruleset:
    api.operation: repository_ruleset.destroy
  # So does taking an active one off enforcement.
  selection_ruleset_off:
    api.operation: repository_ruleset.update
  # The audit log names the old level only when it changed.
  ruleset_off_audit_log:
    raw.ruleset_old_enforcement: active
    raw.ruleset_enforcement: [disabled, evaluate]
  ruleset_off_webhook:
    raw.changes.enforcement.from: active
    raw.repository_ruleset.enforcement: [disabled, evaluate]
  condition: (selection and not filter_create_or_blocked) or selection_all_off or selection_ruleset or (selection_ruleset_off and ruleset_off_*)
  timeframe: 15m
entity: resource.uid
fields: [actor.user.name, api.operation, resource.uid, raw.ruleset_name]
sources:
  - name: Elastic
    title: GitHub Protected Branch Settings Changed
    url: https://www.elastic.co/docs/reference/security/prebuilt-rules/rules/integrations/github/defense_evasion_github_protected_branch_settings_changed
    license: Elastic-2.0
    relation: adapted
  - name: Elastic
    title: Several Failed Protected Branch Force Pushes by User
    url: https://www.elastic.co/docs/reference/security/prebuilt-rules/rules/integrations/github/impact_high_number_of_failed_protected_branch_force_pushes_by_user
    license: Elastic-2.0
    relation: inspired
  - name: Panther
    title: GitHub Repository Ruleset Modified
    url: https://github.com/panther-labs/panther-analysis/blob/develop/rules/github_rules/github_repo_ruleset_modified.yml
    license: Apache-2.0
    relation: inspired
  - name: GitHub
    title: Audit log events for your organization
    url: https://docs.github.com/en/enterprise-cloud@latest/organizations/keeping-your-organization-secure/managing-security-settings-for-your-organization/audit-log-events-for-your-organization
    relation: inspired
