    url: https://github.com/SigmaHQ/sigma/blob/master/rules/cloud/azure/audit_logs/azure_ad_user_added_to_admin_role.yml
    author: Raphaël CALVET, @MetallicHack
    license: DRL-1.1
    relation: inspired
  - name: Microsoft Sentinel
    title: Privileged Role Assigned Outside PIM
