id: entra_admin_role_assigned
title: Directory role granted in Entra ID
description: >
  Someone was added to a directory role, made eligible for one in PIM, or
  given one over an administrative unit. Global Administrator handed out at
  2am is not a promotion. An eligible admin activating their role in PIM is
  left out, and so is the copy of each PIM change that the MS-PIM service
  writes to Core Directory.
status: stable
date: 2026-09-24
modified: 2026-10-03
severity: high
confidence: 0.7
attack: [T1098.003]
logsource:
  product: entra
  service: audit_logs
detection:
  selection:
    api.operation|contains: [add member to role, add eligible member to role, add scoped member to role]
  filter_activation:
    api.operation|contains: pim activation
  # PIM's own record of the same change names the person who made it.
  filter_pim_service:
    - raw.initiatedBy.app.displayName: MS-PIM
    - raw.properties.initiatedBy.app.displayName: MS-PIM
  filter_failed:
    status: Failure
  condition: selection and not filter_activation and not filter_pim_service and not filter_failed
  timeframe: 15m
entity: actor.user.name
fields: [actor.user.name, api.operation, resource.uid, src_endpoint.ip]
sources:
  - name: Sigma
    title: User Added To Privilege Role
    url: https://github.com/SigmaHQ/sigma/blob/master/rules/cloud/azure/audit_logs/azure_priviledged_role_assignment_add.yml
