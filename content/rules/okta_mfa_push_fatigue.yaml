id: okta_mfa_push_fatigue
title: MFA push fatigue against an Okta user
description: >
  Five or more MFA prompts were rejected, left unanswered or answered with the
  wrong number by the same user within an hour. The attacker already has the
  password and is waiting for one tired approval; with number challenge on, an
  ignored prompt or a wrong number is what that looks like. Wrong passwords
  are not counted, although Identity Engine logs them as MFA failures too, and
  five of those are a forgotten password. A push refused because the Okta
  Verify app needs an update is left out.
status: stable
date: 2026-09-24
modified: 2026-10-09
severity: high
confidence: 0.75
attack: [T1621]
logsource:
  product: okta
  service: system_log
detection:
  selection_denied_mfa:
    api.operation|contains: auth_via_mfa
    status: Failure
    raw.debugContext.debugData.factor: OKTA_VERIFY_PUSH
  selection_rejected_push:
    api.operation: user.mfa.okta_verify.deny_push
  # Okta's MFA abandonment report: a prompt ignored or walked away from.
  selection_unanswered:
    api.operation: user.authentication.auth_via_mfa
    raw.outcome.result: [UNANSWERED, ABANDONED]
  selection_wrong_number:
    api.operation: user.authentication.auth_via_mfa
    raw.debugContext.debugData.pushWithNumberChallengeResponseType: OV_WITH_CHALLENGE_RESPONSE_INVALID
  condition: selection_*
  timeframe: 1h
  group_by: [actor.user.name]
  count: ">= 5"
entity: actor.user.name
fields: [actor.user.name, src_endpoint.ip, api.operation]
