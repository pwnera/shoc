id: aws_console_mfa_failed_after_password
title: AWS console sign-in failed at the MFA step
description: >
  An IAM user or the root user failed a console sign-in that CloudTrail marks
  as having used MFA. The likely reading, which Splunk and Panther share, is
  that the password was right and the second factor was not, so someone holds
  the password. AWS does not say so in words; its sign-in examples show failed
  sign-ins both with and without MFA marked. The burst rule needs five
  failures from one address and misses this single attempt. A person typing
  an expired code matches too, and usually signs in on the next try.
status: experimental
date: 2026-10-09
severity: medium
confidence: 0.55
attack: [T1078.004, T1621]
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    api.operation: ConsoleLogin
    status: Failure
    raw.additionalEventData.MFAUsed: "Yes"
    actor.user.type: [IAMUser, Root]
  condition: selection
  timeframe: 15m
entity: actor.user.name
fields: [actor.user.name, actor.user.type, src_endpoint.ip, http_request.user_agent, message]
sources:
  - name: Splunk
    title: AWS Console Login Failed During MFA Challenge
    url: https://github.com/splunk/security_content/blob/develop/detections/cloud/aws_console_login_failed_during_mfa_challenge.yml
    license: Apache-2.0
    relation: adapted
  - name: Panther
    title: AWS Unsuccessful MFA attempt
    url: https://github.com/panther-labs/panther-analysis/blob/develop/rules/aws_cloudtrail_rules/aws_cloudtrail_unsuccessful_mfa_attempt.yml
    license: Apache-2.0
    relation: adapted
  - name: AWS
    title: AWS Management Console sign-in events
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference-aws-console-sign-in-events.html
    relation: inspired
