id: google_drive_external_share_burst
title: One account made twenty Drive files visible outside the company in an hour
description: >
  Twenty or more different Drive items went from internal to external
  visibility, shared with an outside address or opened to anyone with the
  link, by one account within an hour. An employee leaving with the customer
  list, or an attacker in someone's account, moves data out this way without
  downloading anything. Sharing a folder is one event, however many files it
  holds, and shares with colleagues are left out.
status: experimental
date: 2026-10-09
modified: 2026-10-12
severity: medium
confidence: 0.5
attack: [T1537, T1530]
logsource:
  product: google
  service: reports
detection:
  # Drive often logs an edit and the sharing change as one activity, edit
  # first; each event is a row of its own, so the share and its
  # visibility_change come from the same event.
  selection:
    api.service.name: drive
    api.operation: [change_user_access, change_document_visibility, change_document_access_scope,
                    change_acl_editors]
    unmapped.params.visibility_change: external
  condition: selection
  timeframe: 1h
  group_by: [actor.user.name]
  count_distinct: resource.uid
  count: ">= 20"
entity: actor.user.name
fields: [actor.user.name, resource.uid, src_endpoint.ip]
sources:
  - name: Chronicle
    title: Google Workspace File Shared from Google Drive to Free Email Domain
    url: https://github.com/chronicle/detection-rules/blob/main/rules/community/workspace/google_workspace_file_shared_from_google_drive_to_free_email_domain.yaral
    author: Google Cloud Security
    license: Apache-2.0
    relation: adapted
  - name: Splunk
    title: Gsuite Drive Share In External Email
    url: https://github.com/splunk/security_content/blob/develop/detections/cloud/gsuite_drive_share_in_external_email.yml
    author: Teoderick Contreras, Splunk
    license: Apache-2.0
    relation: inspired
  - name: Google
    title: Drive audit activity events
    url: https://developers.google.com/workspace/admin/reports/v1/appendix/activity/drive
    relation: inspired
