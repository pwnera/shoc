id: aws_recovery_disabled
title: Bucket versioning or backups switched off, or a database deleted with no way back
description: >
  Versioning was suspended, MFA delete removed by the root user, a backup
  vault or its lock deleted, a recovery point deleted by a person, database
  backups set to zero days, a database snapshot or retained backup deleted by
  a person, or a database deleted without a final snapshot. Ransomware in the
  cloud removes the way back before it encrypts, and for a small company the
  production database is the business. Terraform destroying a development
  database with skip_final_snapshot, or a person tidying old manual
  snapshots, matches too. These are management events, so the rule works on
  LookupEvents too.
status: experimental
date: 2026-10-02
modified: 2026-10-09
severity: high
confidence: 0.7
attack: [T1490, T1485]
logsource:
  product: aws
  service: cloudtrail
detection:
  selection_versioning:
    api.operation: PutBucketVersioning
    raw.requestParameters.VersioningConfiguration.Status: Suspended
  # Only the root user can turn MFA delete off; IaC sends "Disabled" on buckets that never had it.
  selection_mfa_delete:
    api.operation: PutBucketVersioning
    raw.requestParameters.VersioningConfiguration.MfaDelete: Disabled
    actor.user.type: Root
  selection_vault:
    api.operation: [DeleteBackupVault, DeleteBackupVaultLockConfiguration, DeleteRecoveryPoint]
  selection_rds:
    api.operation: [ModifyDBInstance, ModifyDBCluster]
    raw.requestParameters.backupRetentionPeriod: 0
  # RDS expires its own automated snapshots without these calls.
  selection_rds_backups:
    api.service.name: rds.amazonaws.com
    api.operation: [DeleteDBSnapshot, DeleteDBClusterSnapshot, DeleteDBInstanceAutomatedBackup, DeleteDBClusterAutomatedBackup]
  selection_rds_no_final_snapshot:
    api.service.name: rds.amazonaws.com
    api.operation: [DeleteDBInstance, DeleteDBCluster]
    raw.requestParameters.skipFinalSnapshot: true
  success:
    status: Success
  filter_aws:
    actor.invoked_by|exists: true
  filter_aws_type:
    actor.user.type: AWSService
  condition: success and selection_* and not filter_aws and not filter_aws_type
  timeframe: 15m
entity: actor.user.name
fields: [actor.user.name, actor.session.uid, api.operation, resource.uid, raw.requestParameters.bucketName, raw.requestParameters.dBInstanceIdentifier, raw.requestParameters.dBSnapshotIdentifier]
