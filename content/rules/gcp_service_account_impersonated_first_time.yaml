id: gcp_service_account_impersonated_first_time
title: A person changed GCP as a service account for the first time
description: >
  A change was made by a service account on behalf of a person (gcloud with
  --impersonate-service-account, Terraform impersonation, or a token minted
  with generateAccessToken), and that person had not acted through that
  service account in 30 days. Impersonation is how a stolen user session
  reaches a service account's wider rights, and the token minting itself is
  in the Data Access log, which is off by default. The change records the
  person behind it, and that is what this reads. Google's own agents, which
  delegate too, are left out. Fires once per person and service account.
status: experimental
date: 2026-10-09
severity: medium
confidence: 0.5
attack: [T1548.005, T1078.004]
logsource:
  product: gcp
  service: audit
detection:
  # actor.invoked_by is the delegation's first party, the person behind the call.
  selection:
    actor.invoked_by|exists: true
    status: Success
  # Cloud Build, Scheduler and other Google agents delegate as well.
  filter_google_agent:
    actor.invoked_by|endswith: gserviceaccount.com
  condition: selection and not filter_google_agent
  timeframe: 1h
baseline:
  first_seen: [actor.user.name, actor.invoked_by]
  lookback: 30d
entity: actor.invoked_by
fields: [actor.invoked_by, actor.user.name, api.operation, src_endpoint.ip, cloud.account.uid]
sources:
  - name: Google
    title: Event Threat Detection overview
    url: https://cloud.google.com/security-command-center/docs/concepts-event-threat-detection-overview
    relation: inspired
  - name: Google
    title: AuditLog
    url: https://cloud.google.com/logging/docs/reference/audit/auditlog/rest/Shared.Types/AuditLog
    relation: inspired
  - name: Stratus Red Team
    title: Impersonate GCP Service Accounts
    url: https://github.com/DataDog/stratus-red-team/blob/main/docs/attack-techniques/GCP/gcp.privilege-escalation.impersonate-service-accounts.md
    license: Apache-2.0
    relation: inspired
