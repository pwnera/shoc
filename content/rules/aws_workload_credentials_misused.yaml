id: aws_workload_credentials_misused
title: An instance or function role created credentials or opened a console session
description: >
  Credentials issued to an EC2 instance or a Lambda function created IAM users,
  keys or console passwords, granted user policies, signed in to the console,
  or ran commands on other instances. Workloads do not do this; credentials
  stolen from the instance metadata service or a function's environment do.
  Denied attempts count too.
status: experimental
date: 2026-10-02
modified: 2026-10-03
severity: high
confidence: 0.75
attack: [T1552.005, T1078.004, T1098.001, T1136.003]
logsource:
  product: aws
  service: cloudtrail
detection:
  selection_instance:
    actor.user.uid|re: ':assumed-role/[^/]+/i-[0-9a-f]{8,17}$'
  selection_instance_scope:
    device.uid|startswith: i-
  selection_lambda:
    http_request.user_agent|contains: exec-env/AWS_Lambda
  # CloudTrail names the function the credentials were issued to, so this
  # holds outside Lambda, where the agent string no longer says so.
  selection_lambda_scope:
    raw.userIdentity.inScopeOf.issuerType: AWS::Lambda::Function
  selection_ops:
    api.operation: [CreateUser, CreateAccessKey, CreateLoginProfile, UpdateLoginProfile, AttachUserPolicy, PutUserPolicy, AddUserToGroup, ConsoleLogin, GetSigninToken, GetFederationToken, SendCommand, StartSession]
  condition: (selection_instance or selection_instance_scope or selection_lambda or selection_lambda_scope) and selection_ops
  timeframe: 15m
entity: actor.user.name
fields: [actor.user.name, actor.user.uid, device.uid, src_endpoint.ip, api.operation, status]
sources:
