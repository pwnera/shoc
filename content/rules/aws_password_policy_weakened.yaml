id: aws_password_policy_weakened
title: Account password policy weakened or removed
description: >
  Someone removed the account password policy, or replaced it with one that
  allows passwords shorter than 14 characters, the CIS minimum. Leaving the
  length out sets it to AWS's default of 6. On its own it is a
  misconfiguration; next to other changes it is preparation. Raising the
  policy to 14 or more is not a match.
status: stable
date: 2026-09-24
modified: 2026-10-03
severity: medium
confidence: 0.6
attack: [T1556]
logsource:
  product: aws
  service: cloudtrail
detection:
  removed:
    api.operation: DeleteAccountPasswordPolicy
  updated:
    api.operation: UpdateAccountPasswordPolicy
  short:
    raw.requestParameters.minimumPasswordLength|lt: 14
  default_length:
    raw.requestParameters.minimumPasswordLength|exists: false
  success:
    status: Success
  condition: success and (removed or (updated and (short or default_length)))
  timeframe: 15m
entity: actor.user.name
fields: [actor.user.name, api.operation, raw.requestParameters.minimumPasswordLength]
sources:
  - name: Elastic
    title: AWS IAM Account Password Policy Deleted
    url: https://github.com/elastic/detection-rules/blob/main/rules/integrations/aws/defense_evasion_iam_account_password_policy_deleted.toml
    license: Elastic-2.0
    relation: inspired
  - name: AWS
    title: UpdateAccountPasswordPolicy (IAM API Reference)
    url: https://docs.aws.amazon.com/IAM/latest/APIReference/API_UpdateAccountPasswordPolicy.html
    relation: inspired
  - name: AWS
    title: Security Hub CSPM controls for IAM (IAM.15, minimum password length of 14)
    url: https://docs.aws.amazon.com/securityhub/latest/userguide/iam-controls.html
    relation: inspired
  - name: Splunk
    title: AWS CloudTrail UpdateAccountPasswordPolicy data source
    url: https://github.com/splunk/security_content/blob/develop/data_sources/aws_cloudtrail_updateaccountpasswordpolicy.yml
    relation: inspired
