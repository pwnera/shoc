id: github_security_feature_disabled
title: GitHub secret scanning, 2FA, IP allow list or token restriction switched off
description: >
  Turning off secret scanning or push protection, or letting anyone with write
  bypass it, comes before pushing stolen code or reading secrets out of
  history. Dropping the 2FA requirement or its allowed methods, the OAuth app
  restrictions, the IP allow list, the SSH certificate requirement, the
  restriction on personal access tokens or the approval of fine-grained ones
  opens the organisation to the next login, app or token. Hiding source
  addresses in the audit log blinds every rule that reads one. Repository
  settings arrive by webhook too; the organisation settings need the
  audit-log API.
status: experimental
date: 2026-10-02
modified: 2026-10-09
severity: high
confidence: 0.6
attack: [T1562.001, T1556]
logsource:
  product: github
  service: audit_log
detection:
  selection:
    api.operation:
      - repository_secret_scanning.disable
      - repository_secret_scanning_push_protection.disable
      - repository_secret_scanning_custom_pattern_push_protection.disabled
      - repo.advanced_security_disabled
      - secret_scanning.disable
      - secret_scanning_new_repos.disable
      - org.secret_scanning_push_protection_disable
      - org.secret_scanning_push_protection_new_repos_disable
      - org.secret_scanning_custom_pattern_push_protection_disabled
      - org.advanced_security_disabled_on_all_repos
      - org.advanced_security_disabled_for_new_repos
      - org.disable_two_factor_requirement
      - org.disable_oauth_app_restrictions
      - org_secret_scanning_push_protection_bypass_list.disable
      - repository_secret_scanning_push_protection_bypass_list.disable
      - org_secret_scanning_generic_secrets.disabled
      - repository_secret_scanning_generic_secrets.disabled
      - org.clear_disallowed_two_factor_methods
      - ip_allow_list.disable
      - ip_allow_list.disable_for_installed_apps
      - ssh_certificate_requirement.disable
      - personal_access_token.access_restriction_disabled
      - auto_approve_personal_access_token_requests.enable
      - org.disable_source_ip_disclosure
  condition: selection
  timeframe: 15m
entity: actor.user.name
fields: [actor.user.name, api.operation, resource.uid]
