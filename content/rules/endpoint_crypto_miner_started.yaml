logsource:
  product: edr
  service: telemetry
detection:
  selection_process:
    class_uid: 1007
    activity_id: 1
  # The last nine are --donate-level=, stratum+tcp:// and stratum+udp:// in base64.
  sel_miner_args:
    process.cmd_line|contains: [' --cpu-priority=', '--donate-level', ' -o pool.', ' --nicehash', ' --algo=rx/0 ',
                                'stratum+tcp://', 'stratum+ssl://', 'stratum+udp://', 'stratum2+tcp://',
                                'modprobe msr allow_writes=on',
                                LS1kb25hdGUtbGV2ZWw9, 0tZG9uYXRlLWxldmVsP, tLWRvbmF0ZS1sZXZlbD,
                                c3RyYXR1bSt0Y3A6Ly, N0cmF0dW0rdGNwOi8v, zdHJhdHVtK3RjcDovL,
                                c3RyYXR1bSt1ZHA6Ly, N0cmF0dW0rdWRwOi8v, zdHJhdHVtK3VkcDovL]
  sel_miner_name:
    process.name: [xmrig, xmrig.exe, xmrig-notls, xmr-stak, xmr-stak.exe, nbminer, nbminer.exe, t-rex, t-rex.exe,
                   lolMiner, lolMiner.exe, cpuminer, minerd]
  # Compiling a file called pool.c.
  filter_build:
    process.cmd_line|contains: [' pool.c ', ' pool.o ', 'gcc -', 'clang -']
  sel_pool_lookup:
    class_uid: 4003
    query.hostname|endswith: [supportxmr.com, c3pool.com, c3pool.org, moneroocean.stream, nanopool.org,
                              hashvault.pro, herominers.com, 2miners.com, xmrpool.eu, minexmr.com, f2pool.com,
                              unmineable.com, kryptex.network, monerohash.com, minergate.com, miningocean.org,
                              luckpool.net, hashcity.org, donate.v2.xmrig.com, donate.ssl.xmrig.com]
  condition: (selection_process and (sel_miner_args or sel_miner_name) and not filter_build) or sel_pool_lookup
  timeframe: 1h
entity: resource.uid
fields: [device.hostname, actor.user.name, process.name, process.cmd_line, process.parent_process.name,
         process.file.path, query.hostname]
