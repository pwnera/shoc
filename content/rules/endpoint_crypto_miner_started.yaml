id: endpoint_crypto_miner_started
title: A crypto miner started, or a machine looked up a mining pool
description: >
  A process ran with XMRig-style arguments (a pool address, stratum://, a
  donate level, the msr module XMRig loads on Linux), under a known miner
  name, or a machine looked up a Monero mining pool. Opportunistic crews drop
  a miner first on an exposed server; React2Shell exploits in December 2025
  left XMRig renamed after system processes on Next.js servers.
  On a small company's one web server the miner is often the only visible sign
  of an exploited app, and whoever got in can sell that access for worse.
  cloudflare_gateway_threat_domain_lookup covers mining lookups from devices
  behind Gateway; this rule reads the EDR, so it covers servers too.
status: experimental
date: 2026-10-09
severity: high
confidence: 0.8
attack: [T1496]
sources:
