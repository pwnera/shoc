    title: "Potential Crypto Mining Activity"
    url: https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_susp_crypto_mining_monero.yml
    author: "Florian Roth (Nextron Systems)"
    license: DRL-1.1
    relation: adapted
  - name: Sigma
    title: "Linux Crypto Mining Indicators"
    url: https://github.com/SigmaHQ/sigma/blob/master/rules/linux/process_creation/proc_creation_lnx_crypto_mining.yml
    author: "Florian Roth (Nextron Systems)"
    license: DRL-1.1
    relation: adapted
  - name: Sigma
    title: "Monero Crypto Coin Mining Pool Lookup"
    url: https://github.com/SigmaHQ/sigma/blob/master/rules/network/dns/net_dns_pua_cryptocoin_mining_xmr.yml
    author: "Florian Roth (Nextron Systems)"
    license: DRL-1.1
    relation: adapted
  - name: Microsoft Sentinel
    title: "NRT DNS events related to mining pools"
    url: https://github.com/Azure/Azure-Sentinel/blob/master/Solutions/Windows%20Server%20DNS/Analytic%20Rules/NRT_DNS_Related_To_Mining_Pools.yaml
    license: MIT
