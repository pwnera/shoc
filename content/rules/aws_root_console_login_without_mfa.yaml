id: aws_root_console_login_without_mfa
title: AWS root user signed in to the console without MFA
description: >
  The root user signed in to the console and CloudTrail reports that no MFA
  was used. Root can do anything in the account, including closing it, and
  nobody should need it day to day: either the root user has no MFA, or the
  session was established with a stolen password. Every such sign-in fires,
  however familiar the address.
status: stable
date: 2026-10-12
severity: high
confidence: 0.65
attack: [T1078.004, T1556.006]
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    api.operation: ConsoleLogin
    status_code: no_mfa
    actor.user.type: Root
  condition: selection
  timeframe: 15m
entity: actor.user.name
fields: [actor.user.name, actor.user.type, src_endpoint.ip, http_request.user_agent, cloud.account.uid]
sources:
  - name: Sigma
    title: AWS Successful Console Login Without MFA
    url: https://github.com/SigmaHQ/sigma/blob/master/rules/cloud/aws/cloudtrail/aws_cloudtrail_console_login_success_without_mfa.yml
    author: Thuya@Hacktilizer, Ivan Saakov
    license: DRL-1.1
    relation: adapted
