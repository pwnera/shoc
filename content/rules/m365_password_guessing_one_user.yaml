id: m365_password_guessing_one_user
title: One Microsoft 365 account's password failed from many addresses (Microsoft 365 audit)
description: >
  The password of one account failed, or the account was locked, from eight or
  more addresses within an hour. A credential stuffing run through residential
  proxies sends each attempt from a new address, so the rule that counts per
  address stays quiet; counting per account catches the run aimed at one
  person. A failed MFA step is left out: whoever got that far had the password.
status: experimental
date: 2026-10-12
severity: medium
confidence: 0.6
attack: [T1110.001, T1110.004]
logsource:
  product: m365
  service: management
detection:
  selection:
    api.operation: UserLoginFailed
    status_code: ["50126", "50053"]
  condition: selection
  timeframe: 1h
  group_by: [actor.user.name]
  count_distinct: src_endpoint.ip
  count: ">= 8"
entity: actor.user.name
fields: [actor.user.name, src_endpoint.ip, status_code, http_request.user_agent]
sources:
  - name: Elastic
    title: Potential Okta Brute Force (Multi-Source)
    url: https://www.elastic.co/docs/reference/security/prebuilt-rules/rules/integrations/okta/credential_access_okta_brute_force_multi_source
    license: Elastic-2.0
    relation: inspired
  - name: Microsoft
    title: Microsoft Entra authentication and authorization error codes
    url: https://learn.microsoft.com/en-us/entra/identity-platform/reference-error-codes
    relation: inspired
