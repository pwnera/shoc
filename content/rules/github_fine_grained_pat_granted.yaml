id: github_fine_grained_pat_granted
title: Fine-grained token given access to the organisation
description: >
  A fine-grained personal access token was given access to the organisation's
  repositories. A token outlives the session that made it and is the usual way
  stolen access is kept; the token's name and repositories are in the record.
  A request still waiting for an owner's approval grants nothing and does not
  fire.
status: experimental
date: 2026-10-02
modified: 2026-10-03
severity: medium
confidence: 0.45
attack: [T1098.001, T1528]
logsource:
  product: github
  service: audit_log
detection:
  selection:
    api.operation: personal_access_token.access_granted
  condition: selection
  timeframe: 15m
entity: actor.user.name
fields: [actor.user.name, api.operation, src_endpoint.ip, raw.user_programmatic_access_name, raw.repository_selection]
sources:
  - name: Elastic
    title: New GitHub Personal Access Token (PAT) Added
    url: https://www.elastic.co/docs/reference/security/prebuilt-rules/rules/integrations/github/persistence_new_pat_created
    license: Elastic-2.0
    relation: adapted
  - name: GitHub
    title: Audit log events for your organization
    url: https://docs.github.com/en/enterprise-cloud@latest/organizations/keeping-your-organization-secure/managing-security-settings-for-your-organization/audit-log-events-for-your-organization
    relation: inspired
