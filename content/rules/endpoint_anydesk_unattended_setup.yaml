id: endpoint_anydesk_unattended_setup
title: AnyDesk was set up for unattended access from a script
description: >
  AnyDesk was given a password, or installed silently to start with Windows.
  Helpdesk-scam callers and intruders set it up this way to come back without
  anyone accepting the session; an MSP's deployment script looks the same.
status: experimental
date: 2026-10-02
severity: medium
confidence: 0.6
attack: [T1219]
sources:
  - name: Sigma
    title: "Remote Access Tool - AnyDesk Piped Password Via CLI"
    url: https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_remote_access_tools_anydesk_piped_password_via_cli.yml
    author: "Nasreddine Bencherchali (Nextron Systems)"
    license: DRL-1.1
    relation: adapted
  - name: Sigma
    title: "Remote Access Tool - AnyDesk Silent Installation"
    url: https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_remote_access_tools_anydesk_silent_install.yml
    author: "Ján Trenčanský"
    license: DRL-1.1
    relation: adapted
logsource:
  product: edr
  service: telemetry
detection:
  selection_process:
    class_uid: 1007
    activity_id: 1
  sel_anydesk:
    process.cmd_line|contains: anydesk
  sel_password:
    process.cmd_line|contains: --set-password
  sel_silent:
    process.cmd_line|contains: --silent
  sel_autostart:
    process.cmd_line|contains: --start-with-win
  condition: selection_process and sel_anydesk and (sel_password or (sel_silent and sel_autostart))
  timeframe: 1h
entity: resource.uid
fields: [device.hostname, actor.user.name, process.name, process.cmd_line,
         process.parent_process.name, process.file.path]
