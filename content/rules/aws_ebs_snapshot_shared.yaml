id: aws_ebs_snapshot_shared
title: EC2 or RDS snapshot, or machine image, shared outside the account
description: >
  A disk snapshot, a machine image or a database snapshot was shared with
  another account or made public. It is a quiet way to copy a whole server or
  the company's database out. Removing a share, an empty addition and a share
  made by an AWS service for the company, such as AWS Backup or Image Builder,
  are not a match.
status: stable
date: 2026-09-24
modified: 2026-10-03
severity: high
confidence: 0.7
attack: [T1537]
logsource:
  product: aws
  service: cloudtrail
detection:
  selection_ebs:
    api.operation: ModifySnapshotAttribute
    raw.requestParameters.createVolumePermission.add.items|exists: true
  selection_ami:
    api.operation: ModifyImageAttribute
    raw.requestParameters.launchPermission.add.items|exists: true
  selection_rds:
    api.operation: [ModifyDBSnapshotAttribute, ModifyDBClusterSnapshotAttribute]
    raw.requestParameters.attributeName: restore
    raw.requestParameters.valuesToAdd|exists: true
  # AWS Backup, Image Builder and Marketplace sharing on the company's behalf.
  filter_aws:
    actor.invoked_by|exists: true
  success:
    status: Success
  condition: success and selection_* and not filter_aws
  timeframe: 15m
entity: actor.user.name
fields: [actor.user.name, api.operation, resource.uid, raw.requestParameters.snapshotId, raw.requestParameters.imageId, raw.requestParameters.dBSnapshotIdentifier]
sources:
