id: aws_guardduty_disabled
title: GuardDuty or Security Hub switched off or blinded
description: >
  A GuardDuty detector was deleted or disabled, a member account cut loose,
  its findings export or threat list removed, an address or domain list marked
  trusted, an auto-archive filter added, or Security Hub disabled. Each one
  stops findings about an attacker from reaching anyone. Changing how often
  findings are published, or turning a protection plan on, is not a match.
status: stable
date: 2026-09-24
modified: 2026-10-03
severity: critical
confidence: 0.85
attack: [T1562.001]
logsource:
  product: aws
  service: cloudtrail
detection:
  selection_off:
    api.service.name: guardduty.amazonaws.com
    api.operation: [DeleteDetector, DisassociateFromMasterAccount, DisassociateFromAdministratorAccount, DeleteMembers, DisassociateMembers, StopMonitoringMembers, DeletePublishingDestination, DeleteThreatIntelSet, DeleteThreatEntitySet]
  selection_disabled:
    api.service.name: guardduty.amazonaws.com
    api.operation: UpdateDetector
    raw.requestParameters.enable: false
  selection_trusted_ips:
    api.service.name: guardduty.amazonaws.com
    api.operation: [CreateIPSet, UpdateIPSet, CreateTrustedEntitySet, UpdateTrustedEntitySet]
    raw.requestParameters.activate: true
  selection_auto_archive:
    api.service.name: guardduty.amazonaws.com
    api.operation: [CreateFilter, UpdateFilter]
    raw.requestParameters.action: ARCHIVE
  selection_securityhub:
    api.operation: [DisableSecurityHub, DisableSecurityHubV2]
  success:
    status: Success
  condition: success and selection_*
  timeframe: 15m
entity: actor.user.name
fields: [actor.user.name, api.operation, cloud.account.uid, cloud.region]
