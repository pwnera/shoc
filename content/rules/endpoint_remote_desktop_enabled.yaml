id: endpoint_remote_desktop_enabled
title: Remote Desktop was turned on, or allowed through the firewall, by a command
description: >
  A command set fDenyTSConnections to 0, called SetAllowTSConnections(1),
  opened TCP 3389 in the Windows firewall or enabled its Remote Desktop rule
  group; on Defender the registry write itself is also read. Intruders turn
  Remote Desktop on so they can come back interactively and move between
  machines, often with one batch file run on every host they reach.
  endpoint_rdp_logon_from_internet sees the logon; this sees the door being
  opened on a laptop that never had it. The switch in System Properties or
  Settings and Group Policy's own value are left out; IT enabling RDP on a new
  server with a script looks the same.
status: experimental
date: 2026-10-09
severity: high
confidence: 0.65
attack: [T1021.001, T1112, T1562.004]
