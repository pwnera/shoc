logsource:
  product: edr
  service: telemetry
detection:
  selection_process:
    class_uid: 1007
    activity_id: 1
  sel_deny_value:
    process.cmd_line|contains: fDenyTSConnections
  # 0, not 0x00000001: '/d 0' alone would also match the hex form of 1.
  sel_deny_zero:
    - process.cmd_line|contains: ['/d 0 ', '/d 0"', '/d "0"', '/d 0x0 ', '/d 0x00000000', '-Value 0 ', '-Value 0;']
    - process.cmd_line|endswith: ['/d 0', '-Value 0', '/d 0x0']
  sel_wmi_on:
    process.cmd_line|contains: ['SetAllowTSConnections 1', 'SetAllowTSConnections(1', 'SetAllowTSConnections "1"',
                                "SetAllowTSConnections '1'"]
  sel_netsh:
    process.name: netsh.exe
    process.cmd_line|contains: firewall
  sel_rdp_port:
    process.cmd_line|contains: ['localport=3389', 'tcp 3389', ' 3389 ']
  sel_netsh_allow:
    process.cmd_line|contains: [allow, portopening]
  sel_rdp_group:
    process.cmd_line|contains: ['remote desktop', remotedesktop]
  sel_netsh_enable:
    process.cmd_line|contains: enable=yes
  sel_ps_firewall:
    process.cmd_line|contains: Enable-NetFirewallRule
  # Defender only: Falcon's ASEP events do not cover this key, and SentinelOne
  # does not keep registry events by default. Group Policy writes under
  # SOFTWARE\Policies\, which this path does not match.
  sel_registry:
    raw.category: AdvancedHunting-DeviceRegistryEvents
    api.operation: RegistryValueSet
    raw.properties.RegistryKey|contains: '\Control\Terminal Server'
    raw.properties.RegistryValueName: fDenyTSConnections
    raw.properties.RegistryValueData: '0'
  # The switches an admin clicks in System Properties or Settings.
  filter_gui:
    process.name: [SystemPropertiesRemote.exe, SystemSettingsAdminFlows.exe, SystemSettings.exe]
  condition: (selection_process and ((sel_deny_value and sel_deny_zero) or sel_wmi_on or (sel_netsh and ((sel_rdp_port and sel_netsh_allow) or (sel_rdp_group and sel_netsh_enable))) or (sel_ps_firewall and sel_rdp_group))) or (sel_registry and not filter_gui)
  timeframe: 1h
entity: [device.uid, resource.uid]
fields: [device.hostname, actor.user.name, process.name, process.cmd_line,
         process.parent_process.name, raw.properties.RegistryValueData]
