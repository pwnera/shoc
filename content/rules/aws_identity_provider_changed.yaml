id: aws_identity_provider_changed
title: SAML, OIDC or Roles Anywhere trust created or changed in AWS
description: >
  An IAM SAML or OIDC provider was created, changed or deleted, Identity
  Center's external identity provider was switched, or a Roles Anywhere trust
  anchor or profile was set up. An identity provider the attacker controls
  signs them in again after every key rotation.
status: experimental
date: 2026-10-02
modified: 2026-10-03
severity: high
confidence: 0.7
attack: [T1484.002, T1098]
logsource:
  product: aws
  service: cloudtrail
detection:
  selection_iam:
    api.service.name: iam.amazonaws.com
    api.operation: [CreateOpenIDConnectProvider, UpdateOpenIDConnectProviderThumbprint, AddClientIDToOpenIDConnectProvider, CreateSAMLProvider, UpdateSAMLProvider, DeleteSAMLProvider]
  selection_identity_center:
    api.operation: [EnableExternalIdPConfigurationForDirectory, DisableExternalIdPConfigurationForDirectory, AssociateDirectory, DisassociateDirectory]
  selection_roles_anywhere:
    api.service.name: rolesanywhere.amazonaws.com
    api.operation: [CreateTrustAnchor, UpdateTrustAnchor, CreateProfile]
  filter_identity_center_managed:
    actor.invoked_by: sso.amazonaws.com
  # The agent string alone can be typed by anyone; Identity Center's own call
  # also names the service, not an address, as its source.
  filter_identity_center_agent:
    http_request.user_agent: sso.amazonaws.com
    src_endpoint.ip|exists: false
  success:
    status: Success
  condition: success and selection_* and not filter_identity_center_managed and not filter_identity_center_agent
  timeframe: 15m
entity: actor.user.name
fields: [actor.user.name, actor.session.uid, src_endpoint.ip, api.operation, resource.uid]
