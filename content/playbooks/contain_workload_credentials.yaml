id: contain_workload_credentials
title: Contain an instance or function role's credentials used elsewhere
description: >
  Credentials an EC2 instance or a Lambda function received from its role made
  IAM users, keys or console sessions. They are session credentials, so there
  is no access key to disable; the role's older sessions are what to cut. That
  stops the instance or function itself until it fetches new credentials, so it
  waits for a human, who is paged first.
rules:
  - aws_workload_credentials_misused
questions:
  - id: where_used
    ask: From which addresses were the role's credentials used, and is any of them outside the instance's or function's own network?
  - id: created
    ask: Which IAM users, access keys, login profiles or policies did the credentials create, and have those been used since?
  - id: how_taken
    ask: Did the instance serve a request that could reach the metadata service (an SSRF), or did the function's environment leak, in the hour before?
benign_when:
  - A bootstrap script on a named instance creates a service user at launch, and it did the same on its last launches.
example: |
  claim (where_used): "Credentials of role web-prod issued to i-0abc were used from 198.51.100.23, an address outside the VPC, to call CreateUser", citing the CreateUser event.
  checked and absent: "any earlier CreateUser by this role (30d)", which rules out a bootstrap script that does this at every launch.
  disposition: malicious, because instance credentials were used from outside AWS to create a user.
trigger:
  verdict: [malicious]
  severity_at_least: high
  min_confidence: 0.8
steps:
  - name: page the on-call engineer
    action: notify.page
    params:
      summary: "shoc: credentials of role {{ entity.role }} used outside its workload: {{ case.title }}"
      severity: critical
      dedup_key: "{{ case.case_uid }}"
  - name: revoke the role's older sessions
    action: aws.revoke_role_sessions
    optional: true
    params:
      role_name: "{{ entity.role }}"
