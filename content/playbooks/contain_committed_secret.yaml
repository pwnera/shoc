id: contain_committed_secret
title: Revoke a secret found in a repository
description: >
  Secret scanning found a credential in a repository. Only the provider that
  issued it can revoke it, and from a GitHub case shoc acts on GitHub alone,
  so a human is paged with what the crew found out about it.
rules:
  - github_secret_leaked
questions:
  - id: which
    ask: What kind of secret is it, which provider issued it, and does the alert say it is still valid?
  - id: exposure
    ask: Is the repository public, and since when has the secret been in its history?
  - id: used
    ask: If that provider's logs are connected, has the credential been used since it was committed, and from which addresses?
benign_when:
  - The alert is on a test fixture or an example value that was never a live credential.
  - The provider already revoked it and the alert says so.
example: |
  claim (which): "An AWS access key id was found in acme/landing-page and the alert marks it active", citing the alert.
  checked and absent: "a DeleteAccessKey or UpdateAccessKey for that key in CloudTrail since the commit (7d)", which rules out a key already rotated.
  disposition: malicious, because a live cloud key sits in a public repository.
trigger:
  verdict: [malicious, suspicious]
  severity_at_least: high
  min_confidence: 0.6
steps:
  - name: make the repository private while the secret is revoked
    action: github.make_repo_private
    optional: true
    params:
      repo: "{{ entity.resource }}"
  - name: page the on-call engineer
    action: notify.page
    params:
      summary: "shoc: a live secret is committed to {{ entity.resource }}, revoke it at its provider"
      severity: critical
      dedup_key: "{{ case.case_uid }}"
