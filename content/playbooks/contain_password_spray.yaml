id: contain_password_spray
title: Contain a password spray
description: >
  One address failed to sign in to many accounts, or to one account many times,
  or many addresses failed the password of one account.
  The spray matters only if a sign-in succeeded, so the response is to cut the
  sessions of the account that signed in from the address and page a human. The
  case also names every account the spray tried; only the Okta rule that pairs
  the attack with a success says which one got in. The spray guessed that
  account's password, so resetting it waits for a human after the page. Blocking the
  address at the identity provider needs an action shoc does not have yet.
rules:
  - okta_login_failure_burst
  - entra_sign_in_failure_burst
  - aws_console_login_failure_burst
  - okta_lockouts_from_one_address
  - okta_sign_in_after_attack_from_address
  - okta_password_guessing_one_user_many_addresses
  - hunt:entra_legacy_auth_first_use
questions:
  - id: succeeded
    ask: Did any sign-in from the address succeed, and for which account?
  - id: breadth
    ask: How many distinct accounts did the address try, and over how long?
  - id: whose_address
    ask: Is the address one of our egress addresses, a VPN or a shared cloud provider?
benign_when:
  - One user's client with a stale password retried one account from the user's usual address.
example: |
  claim (breadth): "203.0.113.77 tried 48 distinct accounts in 20 minutes, and one sign-in succeeded", citing the success and the first failure.
  checked and absent: "that address in our egress ranges or among the user's past sign-ins (30d)", which rules out a stale client.
  disposition: malicious for the account that signed in; the rest failed.
trigger:
  verdict: [malicious]
  severity_at_least: high
  min_confidence: 0.8
steps:
  - name: revoke the sessions of the account that signed in
    action: okta.revoke_sessions
    optional: true
    params:
      user: "{{ rule.okta_sign_in_after_attack_from_address.user }}"
  - name: page the on-call engineer
    action: notify.page
    params:
      summary: "shoc: password spray from {{ entity.ip }}: {{ case.title }}"
      severity: critical
      dedup_key: "{{ case.case_uid }}"
  - name: reset the password the spray guessed
    action: okta.reset_password
    optional: true
    params:
      user: "{{ rule.okta_sign_in_after_attack_from_address.user }}"
