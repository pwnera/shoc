id: contain_phishing_site_visit
title: Contain a visit to a phishing site
description: >
  Someone reached a site Cloudflare classes as phishing. If they typed their
  password there, the attacker signs in next, so the sessions of the IdP login
  the Gateway user is linked to are revoked (RFC 0027). It acts on cases the
  crew raised to high: a visit alone is medium, and a medium case can neither
  page nor revoke on its own.
rules:
  - cloudflare_gateway_phishing_resolved
questions:
  - id: typed
    ask: Did the person send anything to the site (a POST in Gateway's HTTP log), or reset their password right after?
  - id: signin
    ask: Did the identity provider see a sign-in for this person from a new address, ASN or country in the hour after the visit?
  - id: who_else
    ask: Did anyone else in the company look up the same domain?
benign_when:
  - The domain belongs to the company's phishing-simulation vendor.
  - Security staff opened a reported link to check it.
example: |
  claim (signin): "Twelve minutes after jane.doe@example.com reached login-microsoftonline.example.net, Entra recorded her sign-in from 203.0.113.40, an address she never used", citing the Gateway lookup and the sign-in.
  checked and absent: "a lookup of the same domain by anyone else (24h)", which keeps the case to one person.
  disposition: malicious, because the sign-in came from the phishing proxy's address.
trigger:
  verdict: [malicious]
  entity_kinds: [user]
  severity_at_least: high
  min_confidence: 0.8
steps:
  - name: revoke the person's sessions in Okta
    action: okta.revoke_sessions
    optional: true
    params:
      user: "{{ entity.user }}"
  - name: revoke the person's sessions in Entra ID
    action: entra.revoke_sessions
    optional: true
    params:
      user: "{{ entity.user }}"
  - name: page the on-call engineer
    action: notify.page
    params:
      summary: "shoc: {{ entity.user }} reached a phishing site: {{ case.title }}"
      severity: critical
      dedup_key: "{{ case.case_uid }}"
