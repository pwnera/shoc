id: contain_google_app_grant
title: Contain a third-party app granted access to a Google account
description: >
  A user authorised an OAuth app on their Google account, or an app's token
  was used from a network the app had not called from. The app's token
  outlives a password change and a sign-out. Signing the user out is
  reversible and runs first; revoking the app's token cannot be undone by
  shoc, so it waits for a human, who is paged first.
rules:
  - google_oauth_token_authorized
  - hunt:gws_oauth_client_first_seen
  - hunt:gws_oauth_client_new_network
questions:
  - id: app_scopes
    ask: Which scopes did the authorised app receive, and has it used them?
  - id: breadth
    ask: How many users authorised the same client, and is it already in use in the domain?
  - id: origin
    ask: Did the user authorise it from an address, country or device they have used in the last 30 days?
benign_when:
  - The OAuth client id is one `own.list` records as shoc's own credential, the scope is exactly the one recorded with it, and the grant lines up with a token request shoc made. A client named "shoc" proves nothing; only the recorded id and scope do.
  - The app is from a verified publisher already used in the domain, with read-only profile scopes.
example: |
  claim (app_scopes): "j.doe@example.com gave client 200000000000000000002 full Gmail and Drive access from 203.0.113.70, a country the account has not used", citing the authorisation.
  checked and absent: "any other user authorising the same client (90d)", which rules out an app the company uses.
  disposition: malicious, because an unknown app received full mail and file access from a new country.
  A benign one, from another invented case:
  claim (app_scopes): "Client 100000000000000000001 was authorised with the scope admin.reports.audit.readonly", citing the grant, and own.list records that client id with that one scope.
  checked and absent: "a grant to the same client with any other scope (30d)", which rules out shoc's credential being widened.
  disposition: benign_expected, because the recorded id and scope match and nothing else was granted to it.
trigger:
  verdict: [malicious]
  severity_at_least: high
  min_confidence: 0.8
steps:
  - name: sign the user out of every Google session
    action: google.revoke_sessions
    optional: true
    params:
      user: "{{ entity.user }}"
  - name: page the on-call engineer
    action: notify.page
    params:
      summary: "shoc: app {{ entity.resource }} granted access to {{ entity.user }}: {{ case.title }}"
      severity: critical
      dedup_key: "{{ case.case_uid }}"
  # The authorised client is the event's `client_id`, which the mapping puts in `resource`.
  - name: revoke the app's token
    action: google.revoke_app_token
    optional: true
    params:
      user: "{{ entity.user }}"
      client_id: "{{ entity.resource }}"
