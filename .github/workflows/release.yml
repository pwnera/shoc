name: Release

on:
  push:
    branches: [main]
  # A dry run: the whole gate, the packages, the image and the SBOMs for the
  # version in pyproject.toml, with nothing published.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@7987652d64b4581673a76e33ad5e98e3dd56832f # v4.1.3
        id: release
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  # The crew's verdict scores on the public scenarios, attached to the release (AGT-6).
  evals:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/evals.yml
    with:
      tag: ${{ needs.release-please.outputs.tag }}
    secrets:
      SHOC_LLM_API_KEY: ${{ secrets.SHOC_LLM_API_KEY }}

  # Lint, unit, conformance on Postgres, the upgrade test and the image: all of CI.
  gate:
    needs: release-please
    if: ${{ !cancelled() && (needs.release-please.outputs.released == 'true' || github.event_name == 'workflow_dispatch') }}
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish:
    needs: gate
    if: ${{ !cancelled() && needs.gate.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write       # PyPI Trusted Publishing and cosign keyless signing
      packages: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: the version, which release-please has written into pyproject.toml
        id: version
        run: python -c "import tomllib; print('tag=v' + tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])" >> "$GITHUB_OUTPUT"
      - run: pip install build && python -m build
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        id: syft
      - name: CycloneDX SBOM of the Python runtime the wheel installs
        run: |
          python -m venv /tmp/runtime
          /tmp/runtime/bin/pip install -q dist/*.whl
          mkdir sbom
          ${{ steps.syft.outputs.cmd }} scan dir:/tmp/runtime \
            -o cyclonedx-json=sbom/shoc-${{ steps.version.outputs.tag }}.cdx.json
      - uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf # v3.2.0
      - uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1
      - name: build the image locally for the SBOM and a smoke test
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          load: true
          tags: shoc:release
      - name: CycloneDX SBOM of the image
        run: |
          docker run --rm shoc:release --version
          # ponytail: the amd64 image stands for both platforms; scan each if they diverge.
          ${{ steps.syft.outputs.cmd }} scan docker:shoc:release \
            -o cyclonedx-json=sbom/shoc-${{ steps.version.outputs.tag }}-image.cdx.json
      - uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: release-${{ steps.version.outputs.tag }}
          path: |
            dist/
            sbom/

      # Everything below publishes, so a dry run stops here.
      - name: publish to PyPI with Trusted Publishing
        if: github.event_name == 'push'
        uses: pypa/gh-action-pypi-publish@67339c736fd9354cd4f8cb0b744f2b82a74b5c70 # v1.12.3
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        if: github.event_name == 'push'
        id: build
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE }}:latest
      - uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0
        if: github.event_name == 'push'
      - name: sign the image and attach its CycloneDX SBOM (keyless)
        if: github.event_name == 'push'
        run: |
          cosign sign --yes "$IMAGE@${{ steps.build.outputs.digest }}"
          cosign attest --yes --type cyclonedx \
            --predicate sbom/shoc-${{ steps.version.outputs.tag }}-image.cdx.json \
            "$IMAGE@${{ steps.build.outputs.digest }}"
      - name: attach the SBOMs to the GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.version.outputs.tag }}" sbom/*.cdx.json
