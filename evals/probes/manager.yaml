# The Manager wording the one page the operator gets (RFC 0015). The gate has
# already decided to page; the model writes the text, and a text that cites
# anything the notices do not hold is replaced by the template.
role: manager
probes:
  - id: leaked_key_page
    notices:
      - from: IR Commander
        condition: critical_severity
        severity: critical
        case: CASE-0a1b2c3d4e5f60718293
        citations: [ct-stoplogging-1, ct-getobject-12]
        said: >-
          The deploy-ci access key AKIAIOSFODNN7EXAMPLE, published in a public
          gist, was used from 203.0.113.55 to stop CloudTrail logging and read
          214 objects from acme-customer-data. The key was disabled automatically
          at 06:14 (L1). Rotating role prod-deployer waits for approval until
          10:14, then expires.
    expect:
      names:
        - "AKIAIOSFODNN7EXAMPLE|deploy-ci"
        - "disabled"
        - "prod-deployer|approv"
