# Tailscale configuration audit log -> OCSF API Activity (6003), with admin
# console and node logins as Authentication (3002). ING-1, ING-3.
# Entries carry no id; the content hash in `stable_uid` keys them.
# Actions and targets: https://tailscale.com/kb/1203/audit-logging
source: tailscale
ocsf_version: "1.3.0"
# The ATT&CK platforms whose techniques these events can show (DET-2).
attack_platforms: [SaaS]

constants:
  category_uid: 6
  class_uid: 6003
  class_name: API Activity
  type_uid: 600399
  activity_id: 99
  activity_name: Other
  severity_id: 1
  status: Success
  cloud_provider: Tailscale
  metadata_product: Tailscale Configuration Log
  api_service_name: tailscale

fields:
  time: { path: eventTime, transform: iso8601 }
  api_operation: { paths: [event, action] }
  message: { path: event }
  # An OAuth client has no login and every one is displayed as "OAuth client";
  # its id is what tells two of them apart.
  actor_user_name: { paths: [actor.loginName, actor.id] }
  actor_user_uid: { path: actor.id }
  actor_user_type: { path: actor.type }
  actor_invoked_by: { path: origin }
  resource_type: { path: target.type }
  resource_uid: { paths: [target.id, target.name] }
  cloud_account_uid: { path: tailnet }
  api_response_error: { path: error, transform: str }

derive:
  - when: { action: { in: [CREATE, INVITE] } }
    set: { activity_id: 1, activity_name: Create, type_uid: 600301 }
  - when: { action: { in: [UPDATE, ENABLE, DISABLE, APPROVE, ACCEPT, SUSPEND, RESTORE, EXPIRE, SIGN, PUSH] } }
    set: { activity_id: 3, activity_name: Update, type_uid: 600303 }
  - when: { action: { in: [DELETE, REVOKE] } }
    set: { activity_id: 4, activity_name: Delete, type_uid: 600304 }
  - when: { action: LOGIN }
    set: { category_uid: 3, class_uid: 3002, class_name: Authentication, activity_id: 1, activity_name: Logon, type_uid: 300201 }
  - when: { action: LOGOUT }
    set: { category_uid: 3, class_uid: 3002, class_name: Authentication, activity_id: 2, activity_name: Logoff, type_uid: 300202 }

  # A node is a device: the id the deauthorize action takes and its MagicDNS name.
  - when: { target.type: NODE }
    set: { device_uid: { path: target.id }, device_hostname: { path: target.name } }

  - when: { error: { exists: true } }
    set: { status: Failure, severity_id: 2 }
  - when: { event: { contains: ".DISABLE." } }
    set: { severity_id: 3 }
  - when: { event: { contains: "API_KEY.CREATE" } }
    set: { severity_id: 3 }

observables:
  - { column: actor_user_name, name: actor.user.name, type: User }
  - { column: resource_uid, name: resource.uid, type: Resource }
  - { column: device_uid, name: device.uid, type: Device }
  - { column: device_hostname, name: device.hostname, type: Hostname }
