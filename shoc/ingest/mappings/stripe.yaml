# Stripe activity logs and events -> OCSF API Activity (6003). ING-1, ING-3.
# An activity log (`accact_…`) and an event (`evt_…`) share this file; each
# field lists the path for both.
source: stripe
ocsf_version: "1.3.0"
# The ATT&CK platforms whose techniques these events can show (DET-2).
attack_platforms: [SaaS]

constants:
  category_uid: 6
  class_uid: 6003
  class_name: API Activity
  type_uid: 600399
  activity_id: 99
  activity_name: Other
  severity_id: 1
  status: Success
  cloud_provider: Stripe
  metadata_product: Stripe
  api_service_name: stripe

fields:
  event_uid: { path: id }
  time: { path: created, transform: iso8601 }
  api_operation: { path: type }
  message: { paths: [data.object.outcome.seller_message, data.object.failure_message] }
  status_code: { path: data.object.failure_code }
  # The person who acted in the dashboard, or the payer on a charge.
  actor_user_name:
    paths: [actor.user.email, data.object.billing_details.email, data.object.receipt_email]
  actor_user_type: { path: actor.type }
  # The API key a change was made with.
  actor_session_uid: { path: actor.api_key.id }
  resource_type: { paths: [details.type, data.object.object] }
  # The key or person a change was about, the SCIM group whose roles changed,
  # or the charge behind a payment event (a fraud warning names its charge in
  # `charge`). An email change is about the address it replaced.
  resource_uid:
    paths:
      - details.api_key.id
      - details.user_roles.user_email
      - details.user_invite.invited_user_email
      - details.authentication.target_email
      - details.user_profile.old_email
      - details.scim.user_email
      - details.scim.group_name
      - data.object.charge
      - data.object.id
  # Events about your own account carry no account id.
  cloud_account_uid: { paths: [context, account], default: stripe }

derive:
  # The verb at the end of the event name.
  - when: { type: { contains: created } }
    set: { activity_id: 1, activity_name: Create }
  - when: { type: { contains: updated } }
    set: { activity_id: 3, activity_name: Update }
  - when: { type: { contains: deleted } }
    set: { activity_id: 4, activity_name: Delete }
  - when: { type: charge.failed }
    set: { status: Failure, activity_id: 1, activity_name: Create }
  - when: { type: { contains: early_fraud_warning } }
    set: { severity_id: 3 }
  - when: { type: { contains: api_key } }
    set: { severity_id: 2 }
  - when: { type: { contains: user_roles } }
    set: { severity_id: 2 }
  - when: { details.type: { in: [account_security, authentication, scim, sso, user_profile] } }
    set: { severity_id: 2 }

observables:
  - { column: actor_user_name, name: actor.user.name, type: User }
  - { column: resource_uid, name: resource.uid, type: Resource }
