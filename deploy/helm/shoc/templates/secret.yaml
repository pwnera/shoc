{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
{{- if not .Values.secrets.values.SHOC_TOKENS }}
{{- fail "secrets.values.SHOC_TOKENS is required: serve refuses to start without tokens off loopback" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "shoc.fullname" . }}
  labels:
    {{- include "shoc.labels" . | nindent 4 }}
  # A hook, created before the migrate hook that reads it; an ordinary
  # resource would only exist once every pre-install hook had finished. Keep
  # stops an upgrade from a chart where it was an ordinary resource pruning it
  # as removed. Hooks outlive `helm uninstall`; delete it by hand.
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.values }}
  {{- if $value }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
{{- end }}
