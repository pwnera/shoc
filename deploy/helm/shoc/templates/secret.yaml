{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
{{- if not .Values.secrets.values.SHOC_TOKENS }}
{{- fail "secrets.values.SHOC_TOKENS is required: serve refuses to start without tokens off loopback" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "shoc.fullname" . }}
  labels:
    {{- include "shoc.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.values }}
  {{- if $value }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
{{- end }}
