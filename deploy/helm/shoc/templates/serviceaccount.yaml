{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name | default (include "shoc.fullname" .) }}
  labels:
    {{- include "shoc.labels" . | nindent 4 }}
# shoc never calls the Kubernetes API, so its pods carry no token for it.
automountServiceAccountToken: false
{{- end }}
