# The console is static files plus a proxy. Serving both from one origin means
# the browser never makes a cross-origin call, so there is no CORS to configure
# and no token in a query string.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # The bundle, the CSS and the API's JSON shrink five to ten times. The event
    # stream (text/event-stream) is left out so it is never buffered.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types application/javascript text/javascript text/css application/json image/svg+xml;

    # A location with its own add_header inherits none from the server block,
    # so every location that sets one repeats these four. The page acts for a
    # signed-in person, often an admin, through a cookie no script can read, and
    # renders log content: the policy allows only this origin, the inline theme
    # script by its hash (index.html; change the hash when that script changes),
    # inline styles, data: images (the badged favicon, the authenticator's QR
    # code) and fonts.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-loZH2nxOsjMR+GyRImHh0vOHxRzdp9Ho7X0hjiqblmw='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

    # Static assets are content-hashed, so they can be cached hard; a missing
    # chunk is a plain 404 that no browser or CDN keeps (no `always` on the cache
    # line), so a rollback that brings the chunk back is seen.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-loZH2nxOsjMR+GyRImHh0vOHxRzdp9Ho7X0hjiqblmw='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    }

    # The event stream and MCP's own streams must not be buffered or timed out. First, since nginx takes the first
    # regex location that matches and /v1/stream would match the API's.
    location ~ ^/(v1/stream|mcp)(/|$) {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $shoc_upstream http://shoc:8080;
        proxy_pass $shoc_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        error_page 502 503 504 = @shoc_down;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding on;
    }

    # The API, the sign-in routes (/auth, RFC 0028), the health check and metrics belong to shoc, as do the
    # stream and MCP above.
    # The upstream is a variable so nginx resolves it per request through
    # Docker's embedded DNS: the console starts even when shoc is not up yet,
    # and answers 502 on those paths until it is, instead of refusing to boot.
    # That 502 is JSON in shoc's own error shape, never nginx's HTML page.
    location ~ ^/(v1|auth|healthz|metrics)(/|$) {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $shoc_upstream http://shoc:8080;
        proxy_pass $shoc_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        error_page 502 503 504 = @shoc_down;
        # Past the kernel's own 120s statement timeout, so a slow query answers before nginx gives up.
        proxy_read_timeout 150s;
    }

    # Vendors push batches here (Cloudflare Logpush sends 5 MB by default): the
    # kernel's own limit (SHOC_MAX_REQUEST_BYTES, 32 MiB), streamed through.
    location ~ ^/ingest(/|$) {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $shoc_upstream http://shoc:8080;
        proxy_pass $shoc_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        error_page 502 503 504 = @shoc_down;
        client_max_body_size 32m;
        proxy_request_buffering off;
        proxy_read_timeout 150s;
    }

    location @shoc_down {
        default_type application/json;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-store" always;
        return 502 '{"error":{"code":"unreachable","message":"shoc is not answering"}}';
    }

    # Everything else is the single-page app. index.html names the hashed
    # chunks, so the browser asks for it again on every load.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-loZH2nxOsjMR+GyRImHh0vOHxRzdp9Ho7X0hjiqblmw='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    }
}
